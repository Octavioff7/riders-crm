<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Riders Miami — CRM</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#262a63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Riders CRM">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<style>
  :root{
    --accent:#007aff;
    --bg:#ffffff;--grouped:#f5f5f7;--card:#ffffff;
    --sidebar:rgba(246,246,248,0.72);--titlebar:rgba(255,255,255,0.72);
    --txt:#1d1d1f;--muted:#86868b;
    --sep:rgba(0,0,0,0.09);--sep-strong:rgba(0,0,0,0.14);--hover:rgba(0,0,0,0.05);--grid:rgba(0,0,0,0.22);
    --in:#ffffff;--out:#007aff;
    --caliente:#ff3b30;--seguimiento:#ff9f0a;--frio:#32ade6;--perdido:#8e8e93;
    --tb:52px;--radius:11px;--desktop:linear-gradient(160deg,#d5dde8 0%,#bcc7d8 100%);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Segoe UI,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body.dark{
      --accent:#0a84ff;
      --bg:#1e1e1e;--grouped:#1c1c1e;--card:#2c2c2e;
      --sidebar:rgba(40,40,42,0.62);--titlebar:rgba(36,36,38,0.72);
      --txt:#f5f5f7;--muted:#98989d;
      --sep:rgba(255,255,255,0.10);--sep-strong:rgba(255,255,255,0.16);--hover:rgba(255,255,255,0.07);--grid:rgba(255,255,255,0.22);
      --in:#3a3a3c;--out:#0a84ff;--desktop:linear-gradient(160deg,#2b2c31 0%,#161619 100%);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);font-size:14px;overflow:hidden;letter-spacing:-0.01em}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.22);border-radius:9px;border:2px solid transparent;background-clip:content-box}
  body.dark ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.24);background-clip:content-box}

  /* WINDOW + TITLEBAR (macOS) */
  .window{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media (prefers-reduced-transparency:reduce){.titlebar,.side,.col-conv,.chat-head,.composer,.asis-head{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}}
  .titlebar{height:var(--tb);flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;background:var(--titlebar);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-bottom:1px solid var(--sep);z-index:20}
  .traffic{position:absolute;left:20px;display:flex;gap:8px}
  .tl{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14);display:grid;place-items:center;border:none;padding:0;cursor:pointer}
  .tl.red{background:#ff5f57}.tl.yellow{background:#febc2e}.tl.green{background:#28c840}
  .tl::before{font-size:9px;font-weight:800;color:rgba(0,0,0,.5);opacity:0;line-height:1}
  .traffic:hover .tl::before{opacity:1}
  .tl.red::before{content:"\00d7"}.tl.yellow::before{content:"\2013"}.tl.green::before{content:"+"}
  body.side-collapsed .side{width:60px}
  body.side-collapsed .brand div,body.side-collapsed nav .lbl,body.side-collapsed nav .count,body.side-collapsed .nav-label,body.side-collapsed .side-foot .demo,body.side-collapsed .side-foot .acct span:not(.a){display:none}
  body.side-collapsed nav button{justify-content:center}
  body.side-collapsed .brand{justify-content:center;padding-left:0;padding-right:0}
  .title{font-size:13px;font-weight:600;color:var(--txt)}
  .theme-toggle{position:absolute;left:80px;background:transparent;border:none;cursor:pointer;font-size:14px;padding:4px 7px;border-radius:7px;line-height:1;transition:background .12s}
  .theme-toggle:hover{background:var(--hover)}
  .shell{flex:1;display:flex;min-height:0}

  /* SIDEBAR */
  .side{position:relative;width:230px;flex-shrink:0;background:var(--sidebar);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-right:1px solid var(--sep);display:flex;flex-direction:column;padding-top:6px;transition:width .28s cubic-bezier(.32,.72,0,1)}
  .side-toggle{position:absolute;top:16px;right:-12px;z-index:20;width:24px;height:24px;border-radius:50%;border:1px solid var(--sep-strong);background:var(--card);color:var(--muted);cursor:pointer;font-size:13px;line-height:1;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.12);transition:transform .2s}
  .side-toggle:hover{color:var(--accent);border-color:var(--accent)}
  .brand{display:flex;align-items:center;gap:10px;padding:8px 18px 12px;color:var(--txt);font-weight:700;font-size:13px}
  .brand .badge{width:28px;height:28px;border-radius:7px;background:#262a63;display:grid;place-items:center;font-size:14px;box-shadow:0 1px 2px rgba(0,0,0,.2);overflow:hidden}
  .badge img{width:100%;height:100%;object-fit:cover;display:block}
  .brand small{display:block;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.4px}
  nav{display:flex;flex-direction:column;gap:1px;padding:6px 10px;flex:1;min-height:0;overflow-y:auto}
  nav button{display:flex;align-items:center;gap:10px;background:transparent;border:none;color:var(--txt);padding:5px 8px;border-radius:7px;font-weight:500;font-size:13.5px;text-align:left;width:100%;transition:background .16s ease}
  nav button .ic{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:13px;flex-shrink:0;box-shadow:0 1px 1px rgba(0,0,0,.18)}
  nav button:nth-of-type(1) .ic{background:#5e5ce6}
  nav button:nth-of-type(2) .ic{background:#34c759}
  nav button:nth-of-type(3) .ic{background:#0a84ff}
  nav button:nth-of-type(4) .ic{background:#ff9f0a}
  nav button:nth-of-type(5) .ic{background:#32ade6}
  nav button:nth-of-type(6) .ic{background:#ff2d55}
  .nav-label{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:8px 12px 4px}
  nav button .count{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted);background:var(--hover);border-radius:9px;padding:0 7px;min-width:20px;height:18px;display:grid;place-items:center}
  nav button.active .count{color:#fff;background:rgba(255,255,255,.28)}
  nav button:hover{background:var(--hover)}
  nav button:active{transform:scale(.98)}
  nav button.active{background:var(--accent);color:#fff}
  nav button.active .ic{background:rgba(255,255,255,.25);box-shadow:none}
  nav .star:hover{color:#fff}
  .side-foot{padding:10px 12px;border-top:1px solid var(--sep)}
  .side-foot .demo{border-radius:7px;padding:5px 9px;font-size:11px;font-weight:600;text-align:center;margin-bottom:10px}
  .side-foot .acct{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--txt);font-weight:500}
  .side-foot .acct .a{width:26px;height:26px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:700;font-size:11px;color:#fff}
  .perfil-btn{display:flex;align-items:center;gap:9px;width:100%;background:transparent;border:none;padding:6px 8px;border-radius:9px;cursor:pointer;color:var(--txt);text-align:left;transition:background .16s ease}
  .perfil-btn:hover{background:var(--hover)}
  .perfil-btn .pf-info{display:flex;flex-direction:column;min-width:0;flex:1}
  .perfil-btn .pf-nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .perfil-btn .pf-rol{font-size:11px;color:var(--muted)}
  .perfil-btn .pf-cog{color:var(--muted);font-size:15px;flex:none}

  main{flex:1;height:100%;overflow:hidden;min-width:0;background:var(--bg)}
  main.scroll{overflow-y:auto}
  .page{padding:28px 34px;max-width:1120px;margin-left:auto;margin-right:auto}
  body.side-collapsed .page{max-width:1280px}
  .page.page-wide{max-width:none}
  .page h1{margin:0 0 3px;font-size:26px;font-weight:700;letter-spacing:-0.021em}
  .page .sub{color:var(--muted);margin-bottom:22px;font-size:13.5px}
  /* Fluid view transitions (macOS spring-like easing) */
  .anim-in{animation:viewIn .28s cubic-bezier(.32,.72,0,1)}
  @keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* CHAT SHARED */
  .msg{max-width:74%;padding:8px 13px;border-radius:16px;font-size:14px;line-height:1.4}
  .msg .t{font-size:10px;color:var(--muted);margin-top:3px;text-align:right;opacity:.8}
  .msg.in{align-self:flex-start;background:var(--in);border:1px solid var(--sep);border-bottom-left-radius:5px}
  .msg.out{align-self:flex-end;background:var(--out);color:#fff;border-bottom-right-radius:5px}
  .msg.out .t{color:rgba(255,255,255,.75)}
  .composer{display:flex;gap:9px;padding:11px 16px;border-top:1px solid var(--sep);background:var(--titlebar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);align-items:center}
  .composer input{flex:1;background:var(--card);border:1px solid var(--sep-strong);border-radius:18px;padding:9px 15px;color:var(--txt);font-size:14px}
  .composer input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,122,255,.22)}
  .composer .send{width:34px;height:34px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:15px;flex-shrink:0;transition:filter .1s}
  .composer .send:active{filter:brightness(.9)}

  /* ASISTENTE */
  .asis{display:flex;flex-direction:column;height:100%;max-width:800px;margin:0 auto;width:100%;background:var(--bg)}
  .asis-head{padding:15px 20px;border-bottom:1px solid var(--sep);background:var(--titlebar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;gap:12px}
  .asis-head .bot{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#0a84ff,#5e5ce6);display:grid;place-items:center;font-size:19px}
  .asis-head h2{margin:0;font-size:15px;font-weight:600}
  .asis-head .s{color:var(--muted);font-size:12.5px;margin-top:2px}
  .asis-msgs{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:10px}
  .msg.bot{background:var(--in);border:1px solid var(--sep)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px 0}
  .chip-s{background:var(--card);border:1px solid var(--sep-strong);border-radius:16px;padding:7px 13px;font-size:12.5px;color:var(--accent);transition:background .1s}
  .chip-s:hover{background:var(--hover)}
  .chip-s:active{transform:scale(.98)}

  /* INBOX */
  .inbox{display:grid;grid-template-columns:320px 1fr 330px;height:100%}
  .col-conv{border-right:1px solid var(--sep);display:flex;flex-direction:column;min-height:0;background:var(--sidebar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  .conv-top{padding:14px 14px 10px}
  .conv-top h2{margin:0 0 4px;font-size:18px;font-weight:700;letter-spacing:-0.01em}
  .conv-top .auto-note{font-size:11.5px;color:#34c759;font-weight:600;margin-bottom:10px}
  .conv-top input{width:100%;background:var(--hover);border:1px solid transparent;border-radius:8px;padding:7px 12px;color:var(--txt);font-size:13px}
  .conv-top input:focus{outline:none;background:var(--card);border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,122,255,.2)}
  .conv-list{overflow-y:auto;flex:1;padding:0 8px 8px}
  .conv{display:flex;gap:11px;padding:8px 10px;margin:1px 0;border-radius:8px;cursor:pointer;align-items:center;transition:background .16s ease}
  .conv:hover{background:var(--hover)}.conv.sel{background:var(--accent)}
  .conv.sel .nm,.conv.sel .pv,.conv.sel .rt{color:#fff}
  .conv.sel .pv,.conv.sel .rt{opacity:.82}
  .av{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:600;color:#fff;font-size:14px}
  .conv .mid{flex:1;min-width:0}
  .conv .nm{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
  .conv .nm .tdot{width:8px;height:8px;border-radius:50%}
  .conv .pv{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .conv .rt{font-size:11px;color:var(--muted);align-self:flex-start;white-space:nowrap}
  .col-chat{display:flex;flex-direction:column;min-height:0;background:var(--grouped)}
  .chat-head{display:flex;align-items:center;gap:11px;padding:10px 16px;border-bottom:1px solid var(--sep);background:var(--titlebar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  .chat-head .nm{font-weight:600}.chat-head .sub{font-size:12px;color:var(--muted)}
  .temp-tag{margin-left:auto;font-size:12px;font-weight:600;padding:3px 11px;border-radius:20px}
  .messages{flex:1;overflow-y:auto;padding:20px 26px;display:flex;flex-direction:column;gap:6px}
  .daysep{align-self:center;background:var(--card);color:var(--muted);font-size:11px;padding:3px 11px;border-radius:20px;margin:6px 0;border:1px solid var(--sep)}
  .hint{font-size:10.5px;color:var(--muted);text-align:center;padding:5px}
  .col-crm{border-left:1px solid var(--sep);overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg)}
  .crm-h{padding:20px 16px;border-bottom:1px solid var(--sep);text-align:center}
  .crm-h .av{margin:0 auto 10px;width:60px;height:60px;font-size:22px}
  .crm-h .nm{font-weight:700;font-size:17px;letter-spacing:-0.01em}.crm-h .wa{color:var(--muted);font-size:13px;margin-top:3px}
  .crm-b{padding:16px}
  .banner{border-radius:12px;padding:11px 13px;margin-bottom:16px;font-weight:500;font-size:13.5px;display:flex;gap:9px;align-items:flex-start;line-height:1.35}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
  .field input,.field select,.field textarea{width:100%;background:var(--card);border:1px solid var(--sep-strong);border-radius:8px;padding:8px 11px;color:var(--txt);font-size:13.5px}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,122,255,.22)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .auto{background:var(--grouped);border:1px solid var(--sep);border-radius:9px;padding:9px 11px;font-size:12.5px;color:var(--muted)}
  .auto b{color:var(--txt)}
  .section-t{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600;margin:18px 0 9px}
  .logitem{background:var(--grouped);border:1px solid var(--sep);border-radius:10px;padding:9px 11px;margin-bottom:7px}
  .logitem .lt{font-size:11px;color:var(--muted);margin-bottom:2px}.logitem .lx{font-size:13px;white-space:pre-wrap;line-height:1.4}
  .btn{background:var(--accent);color:#fff;border:none;padding:7px 14px;border-radius:8px;font-weight:500;font-size:13.5px;transition:filter .1s}
  .btn:active{filter:brightness(.92);transform:scale(.98)}
  .btn.ghost{background:var(--card);color:var(--accent);border:1px solid var(--sep-strong)}.btn.sm{padding:5px 11px;font-size:13px}
  .btn.danger{background:var(--card);color:#ff3b30;border:1px solid #ff3b3066}.btn.danger:hover{background:#ff3b3012}
  .conv-head-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:200;padding:16px;animation:viewIn .18s ease}
  .modal{background:var(--card);border:1px solid var(--sep);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.28);width:420px;max-width:100%;overflow:hidden}
  .modal-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--sep);font-size:15px}
  .modal-b{padding:14px 18px;display:flex;flex-direction:column}
  .modal-b label{font-size:12px;font-weight:600;color:var(--muted);margin:9px 0 3px}
  .modal-b input,.modal-b select,.modal-b textarea{width:100%;background:var(--bg);border:1px solid var(--sep-strong);border-radius:8px;padding:9px 12px;color:var(--txt);font-size:14px;font-family:inherit;box-sizing:border-box}
  .modal-b textarea{min-height:70px;resize:vertical}
  .modal-b input:focus,.modal-b select:focus,.modal-b textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,122,255,.2)}
  .modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--sep)}
  /* ---- Wizard Cargar venta ---- */
  .head-btns{display:flex;gap:8px;flex-wrap:wrap}
  .venta-modal{width:min(480px,calc(100vw - 32px));display:flex;flex-direction:column;max-height:92vh}
  .venta-modal .modal-b{overflow-y:auto}
  .venta-steps{display:flex;align-items:center;gap:6px;padding:12px 18px;border-bottom:1px solid var(--sep)}
  .vstep{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;font-weight:600}
  .vstep .vnum{width:22px;height:22px;border-radius:50%;background:var(--sep);color:var(--muted);display:grid;place-items:center;font-size:12px;flex:none}
  .vstep.on .vnum{background:var(--accent);color:#fff}
  .vstep.on{color:var(--txt)}
  .vstep.done .vnum{background:#34c759;color:#fff}
  .vsep{flex:1;height:1px;background:var(--sep)}
  .scan-box{background:var(--bg);border:1px dashed var(--sep-strong);border-radius:12px;padding:12px;margin-bottom:6px}
  .scan-title{font-size:12.5px;font-weight:700;color:var(--txt);margin-bottom:9px}
  .scan-title span{font-weight:500;color:var(--muted)}
  .scan-imgs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:9px}
  .scan-slot{position:relative;aspect-ratio:1.6;border:1px solid var(--sep-strong);border-radius:9px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;color:var(--muted)}
  .scan-slot:hover{border-color:var(--accent)}
  .scan-slot .scan-plus{font-size:22px;line-height:1}
  .scan-slot .scan-cap{font-size:11.5px;font-weight:600;margin-top:2px}
  .scan-slot.has{cursor:default;border-style:solid}
  .scan-slot.has img{width:100%;height:100%;object-fit:cover}
  .scan-x{position:absolute;top:4px;right:4px;width:22px;height:22px;border:none;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:12px;line-height:1;display:grid;place-items:center}
  .scan-keep{margin-bottom:9px}
  .scan-keep-l{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px}
  .scan-btn{width:100%;font-size:13px}
  .scan-btn:disabled{opacity:.5;cursor:default}
  .scan-msg{font-size:12px;margin-top:7px;text-align:center;min-height:0}
  .scan-msg.ok{color:#248a3d}
  .scan-msg.err{color:#c0392b}
  .seg2{display:flex;gap:0;border:1px solid var(--sep-strong);border-radius:9px;overflow:hidden;margin-bottom:12px}
  .seg2 button{flex:1;border:none;background:var(--card);color:var(--muted);padding:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .seg2 button.on{background:var(--accent);color:#fff}
  .v-hint{background:var(--bg);border-radius:10px;padding:14px;font-size:13px;color:var(--muted);line-height:1.5}
  .v-sec-t{font-size:13px;font-weight:700;color:var(--txt);margin-bottom:8px}
  .v-sec-t span{font-weight:500;color:var(--muted);font-size:12px}
  .v-rows{display:flex;flex-direction:column;gap:9px}
  .v-card{background:var(--bg);border:1px solid var(--sep);border-radius:10px;padding:9px;display:flex;flex-direction:column;gap:7px}
  .v-full{width:100%}
  .v-lbl-sm{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:2px}
  .ent-card{border:1px solid var(--sep);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--card)}

<script>
/* ============ CONFIG ============ */
const ETAPAS=[{id:'nuevo',nombre:'Nuevo',color:'#007aff'},{id:'interesado',nombre:'Interesado',color:'#5e5ce6'},{id:'negociando',nombre:'Negociando',color:'#ff9f0a'},{id:'vendido',nombre:'Vendido',color:'#34c759'},{id:'posventa',nombre:'Posventa',color:'#30b0c7'}];
const PRODUCTOS=['Moto','Kit solar','Triciclo','Otro'];
const OPERACIONES=['','Financiado','Cash'];
const TEMPS={caliente:{label:'Caliente',emoji:'🔥',color:'#ff3b30'},seguimiento:{label:'Seguimiento',emoji:'🟡',color:'#ff9f0a'},sinContacto:{label:'Sin contactar',emoji:'❄️',color:'#32ade6'},perdido:{label:'Perdido',emoji:'🔴',color:'#8e8e93'},frio:{label:'Frío',emoji:'❄️',color:'#3b82f6'},otro:{label:'Otro',emoji:'🏷️',color:'#8e8e93'}};
const AVCOLORS=['#007aff','#5e5ce6','#ff9f0a','#34c759','#30b0c7','#ff3b30','#ff2d55','#af52de'];
const KEY='ridersMiamiCRM_v7',AKEY='ridersMiamiCRM_v7_asis';

/* ============ HELPERS ============ */
function uid(){return 'c'+Math.random().toString(36).slice(2,9);}
function hoy(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function ahora(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10);}
function daysAhead(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function nextWeekday(t){const d=new Date();let a=(t-d.getDay()+7)%7;if(a===0)a=7;d.setDate(d.getDate()+a);return d.toISOString().slice(0,10);}
function diasDesde(f){if(!f)return 9999;return Math.round((new Date(hoy())-new Date(f))/86400000);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function fmt(v){return v?('$'+Number(v).toLocaleString('es')):'—';}
function etapaDe(id){return ETAPAS.find(e=>e.id===id)||ETAPAS[0];}
function iniciales(n){n=(n||'').replace(/\(.*\)/,'').trim();const p=n.split(' ');return ((p[0]||' ')[0]+((p[1]||'')[0]||'')).toUpperCase();}
function avColor(id){let s=0;for(const ch of id)s+=ch.charCodeAt(0);return AVCOLORS[s%AVCOLORS.length];}
// Muestra fechas guardadas como AAAA-MM-DD en formato DD/MM/AAAA (lo que ve el usuario).
function fmtFecha(f){if(!f)return '';const m=String(f).slice(0,10).match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?m[3]+'/'+m[2]+'/'+m[1]:f;}
function relTime(f){const d=diasDesde(f);if(d<=0)return 'Hoy';if(d===1)return 'Ayer';if(d<7)return d+' días';return fmtFecha(f);}
function derive(c){if(c.mensajes&&c.mensajes.length){const m=c.mensajes[c.mensajes.length-1];c.ultimoContacto=m.fecha;c.respondioUltimo=(m.de==='cliente')?'cliente':'yo';}}
function tagsDe(c){return (c.tags&&c.tags.length)?c.tags:(c.tempManual?[c.tempManual]:[]);}
function temperatura(c){
  const _t=tagsDe(c);const _p=['caliente','frio','otro','seguimiento'].find(t=>_t.includes(t));
  if(_p&&TEMPS[_p])return Object.assign({id:_p,motivo:c.tempNota||'',manual:true,tags:_t},TEMPS[_p]);
  if(c.etapa==='vendido'||c.etapa==='posventa')return null;
  if(c.etapa==='nuevo')return Object.assign({id:'sinContacto',motivo:'Apenas hubo contacto — falta un primer seguimiento en serio.'},TEMPS.sinContacto);
  const dias=diasDesde(c.ultimoContacto||c.creado);
  if(c.proximo&&c.proximo<=hoy())return Object.assign({id:'seguimiento',motivo:'Tenés un seguimiento agendado para hoy (o atrasado).'},TEMPS.seguimiento);

function fmtTel(v){
  v=v||'';
  // Autoformato lindo de EE.UU. SOLO si arranca con "+1" y hay dígitos después.
  // Si el usuario borra el +1 o pone otro código de país, se deja escribir libre.
  if(v.indexOf('+1')===0){
    const d=v.slice(2).replace(/\D/g,'').slice(0,10);
    if(!d.length)return v.replace(/[^\d+()\-\s]/g,''); // "+1"/"+1 " → tal cual (permite seguir borrando)
    // El ")" se agrega SOLO con 4+ dígitos, así el backspace borra de corrido (no se re-agrega el ")").
    let s='+1 ('+d.slice(0,Math.min(3,d.length));
    if(d.length>3)s+=') '+d.slice(3,Math.min(6,d.length));
    if(d.length>6)s+='-'+d.slice(6,10);
    return s;
  }
  return v.replace(/[^\d+()\-\s]/g,''); // otro número / código de país: libre
}

function findClient(text){
  const low=text.toLowerCase();
  for(const c of clientes){const full=c.nombre.replace(/\(.*\)/,'').trim().toLowerCase();if(full&&low.includes(full))return c;}
  for(const c of clientes){const first=c.nombre.replace(/\(.*\)/,'').trim().toLowerCase().split(' ')[0];if(first&&new RegExp('\\b'+first+'\\b').test(low))return c;}
  return null;
}
function detProducto(t){t=t.toLowerCase();if(/kit|solar|panel/.test(t))return 'Kit solar';if(/tricicl/.test(t))return 'Triciclo';if(/moto/.test(t))return 'Moto';return null;}
function detEtapa(t){t=t.toLowerCase();if(/vend[ií]|vendid|pag[oó]|compr[oó]|cerr[eé]|cerrado/.test(t))return 'vendido';if(/negoci|regate|oferta/.test(t))return 'negociando';if(/interes|pregunt|consult|quiere|averigu/.test(t))return 'interesado';return null;}
function detFecha(t){t=t.toLowerCase();if(/pasado\s+mañana/.test(t))return daysAhead(2);if(/\bmañana\b/.test(t))return daysAhead(1);if(/\bhoy\b/.test(t))return hoy();if(/semana que viene|pr[oó]xima semana|la otra semana/.test(t))return daysAhead(7);const m=t.match(/en\s+(\d+)\s+d[ií]as/);if(m)return daysAhead(+m[1]);const dd=['domingo','lunes','martes','mi[eé]rcoles','jueves','viernes','s[aá]bado'];for(let i=0;i<7;i++)if(new RegExp('\\b'+dd[i]).test(t))return nextWeekday(i);return '';}
function nuevoNombre(t){const m=t.match(/(?:cargá|carga|agregá|agrega|nuevo cliente|nuevo lead|anotá a|anota a|sumá a|suma a)\s+([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+(?:\s+[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)?)/);return m?m[1].trim():null;}
function procesar(text){
  const acc=[];let c=findClient(text);
  const crearKW=/(cargá|carga|agregá|agrega|nuevo cliente|nuevo lead|anotá a|anota a|sumá a|suma a)/i.test(text);
  if(!c&&crearKW){const nom=nuevoNombre(text);if(nom){c={id:uid(),nombre:nom,whatsapp:'',producto:detProducto(text)||'Moto',ubicacion:'',etapa:'nuevo',valor:0,proximo:hoy(),proximoTipo:'Seguimiento',creado:hoy(),ultimoContacto:hoy(),respondioUltimo:'cliente',log:[],mensajes:[]};clientes.push(c);acc.push('creé el cliente <b>'+esc(nom)+'</b>');}}
  if(!c)return 'No identifiqué de qué cliente hablás. Probá con el nombre — ej: <i>"Yosvani quiere la moto roja"</i>. Para uno nuevo: <i>"Cargá a Juan, preguntó por un triciclo"</i>.';
  const p=detProducto(text);if(p&&p!==c.producto){c.producto=p;acc.push('producto → <b>'+p+'</b>');}
  const e=detEtapa(text);if(e&&e!==c.etapa){c.etapa=e;acc.push('etapa → <b>'+etapaDe(e).nombre+'</b>');}
  const f=detFecha(text);if(f){c.proximo=f;acc.push('seguimiento → <b>'+f+'</b>');}
  c.log=c.log||[];c.log.push({fecha:hoy(),texto});acc.push('anoté la nota en su ficha');
  save();
  return '✅ Listo, en <b>'+esc(c.nombre)+'</b>: '+acc.join(', ')+'.<br><span style="color:#71798a;font-size:12.5px">Miralo en Clientes o Seguimiento.</span>';
}

// Lista de clientes de una sección (para mostrarla como columna del medio al abrir un contacto desde ahí).
function ctxList(ctx){const A=activos();
  const byNuevo=(a,b)=>creaKey(b)-creaKey(a);                    // más nuevo (agregado) arriba
  const byProxAsc=(a,b)=>proxDateTime(a)-proxDateTime(b);         // fecha más temprana/atrasada arriba
  const byProxDesc=(a,b)=>proxDateTime(b)-proxDateTime(a);        // fecha más nueva arriba
  const byVenta=(a,b)=>String(b.vendidoFecha||'').localeCompare(String(a.vendidoFecha||'')); // venta más nueva arriba
  if(ctx==='calientes')return A.filter(c=>{const t=temperatura(c);return t&&t.id==='caliente';}).sort(byNuevo);
  if(ctx==='frios')return A.filter(c=>{const t=temperatura(c);return t&&(t.id==='sinContacto'||t.id==='frio');}).sort(byNuevo);
  if(ctx==='seg')return A.filter(c=>temperatura(c)).sort(byNuevo);
  if(ctx==='anotar')return A.filter(sinAnotar).sort(byNuevo);
  if(ctx==='vendidos')return A.filter(c=>c.etapa==='vendido'||c.etapa==='posventa').sort(byVenta);
  if(ctx==='atrasado')return A.filter(c=>enBucket(c,'atrasado')).sort(byProxAsc);
  if(['hoy','proximos','semana'].includes(ctx))return A.filter(c=>enBucket(c,ctx)).sort(byProxDesc);
  return null;
}

function computeEarn(){const AA=activos();const mesAct=hoy().slice(0,7);const vend=AA.filter(c=>c.etapa==='vendido'||c.etapa==='posventa');const vm=vend.filter(c=>(c.vendidoFecha||'').slice(0,7)===mesAct);const g=a=>a.reduce((s,c)=>s+_comisionVenta(c),0);const q=a=>a.reduce((s,c)=>s+(Number(c.cantidad)||1),0);return {mes:{g:g(vm),n:q(vm)},total:{g:g(vend),n:q(vend)}};}

function googleCal(id){
  const c=clientes.find(x=>x.id===id);if(!c)return;
  const gv=k=>{const el=document.getElementById(k);return el?el.value:'';};
  const f=gv('prox-fecha')||c.proximo, h=gv('prox-hora')||c.proximoHora||'', tp=gv('prox-tipo')||c.proximoTipo||'Seguimiento';
  if(!f){alert('Primero elegí una fecha para el contacto.');return;}
  setProximo(id,false); // agenda también en el CRM (como "Agendar contacto")
  const pad=n=>String(n).padStart(2,'0');
  let dates;
  if(h&&/^\d{1,2}:\d{2}/.test(h)){
    const p=h.split(':'),start=new Date(f+'T'+pad(+p[0])+':'+pad(+p[1])+':00'),end=new Date(start.getTime()+30*60000);
    const fmt=d=>''+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
    dates=fmt(start)+'/'+fmt(end);
  } else {
    const nd=new Date(f+'T00:00:00');nd.setDate(nd.getDate()+1);
    dates=f.replace(/-/g,'')+'/'+(''+nd.getFullYear()+pad(nd.getMonth()+1)+pad(nd.getDate()));

  const url='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+dates+'&details='+encodeURIComponent(det);
  window.open(url,'_blank','noopener');
}

function _fileToScaled(file){return new Promise((resolve,reject)=>{
  const fr=new FileReader();fr.onerror=()=>reject();
  fr.onload=()=>{const img=new Image();img.onerror=()=>reject();
    img.onload=()=>{const max=1100;let w=img.width,h=img.height;
      if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
      resolve({mime:'image/jpeg',data:cv.toDataURL('image/jpeg',0.82).split(',')[1]});};
    img.src=fr.result;};
  fr.readAsDataURL(file);});}

let _adState=null;
const _AD_MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const _AD_DOW=['Lu','Ma','Mi','Ju','Vi','Sá','Do'];
function appDate(o){
  const val=(o.actual&&/^\d{4}-\d{2}-\d{2}$/.test(String(o.actual).slice(0,10)))?String(o.actual).slice(0,10):'';
  // El calendario se abre pegado al campo que lo disparó (no como ventana grande centrada)
  let anc=null;try{const ev=window.event;const el=(ev&&(ev.currentTarget||ev.target))||document.activeElement;anc=el&&el.closest?(el.closest('button')||el):null;}catch(e){}
  _adState={sel:val,view:(val||hoy()).slice(0,7),onPick:o.onPick,clearable:o.clearable!==false,titulo:o.titulo||'Elegí la fecha',anchor:(anc&&anc.getBoundingClientRect)?anc:null};
  _adRender();
}
function _adRender(){
  const m=document.getElementById('modal-date');if(m)m.remove();
  const S=_adState;const y=+S.view.slice(0,4),mo=+S.view.slice(5,7);
  const startDow=(new Date(y,mo-1,1).getDay()+6)%7;
  const dim=new Date(y,mo,0).getDate();const t=hoy();
  let cells='';for(let i=0;i<startDow;i++)cells+='<div class="ad-cell empty"></div>';
  for(let d=1;d<=dim;d++){const ds=y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    cells+='<button type="button" class="ad-cell'+(ds===S.sel?' sel':'')+(ds===t?' today':'')+'" onclick="_adPick(\''+ds+'\')">'+d+'</button>';}
  const wrap=document.createElement('div');wrap.className='ad-back';wrap.id='modal-date';
  wrap.innerHTML='<div class="ad-pop" id="ad-pop">'
    +'<div class="ad-nav"><button type="button" class="mini" onclick="_adMonth(-1)">‹</button><b>'+_AD_MESES[mo-1]+' '+y+'</b><button type="button" class="mini" onclick="_adMonth(1)">›</button></div>'
    +'<div class="ad-grid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-bottom:2px">'+_AD_DOW.map(d=>'<div class="ad-dowc" style="display:block">'+d+'</div>').join('')+'</div>'
    +'<div class="ad-grid" id="ad-dias" style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px">'+cells+'</div>'
    +'<div class="ad-foot">'+(S.clearable?'<button type="button" onclick="_adPick(\'\')">Limpiar</button>':'')+'<button type="button" onclick="_adPick(\''+t+'\')">Hoy</button></div>'
    +'</div>';
  wrap.onclick=e=>{if(e.target===wrap)_adClose();};document.body.appendChild(wrap);
  _adPlace();
}
function _adPlace(){
  const pop=document.getElementById('ad-pop');if(!pop)return;
  // Red de seguridad: si algun estilo del entorno aplasta la grilla, se fuerza a mano.
  try{const gd=document.getElementById('ad-dias');
    if(gd&&gd.getBoundingClientRect().height<40){
      gd.style.cssText='display:grid!important;grid-template-columns:repeat(7,1fr);gap:1px;visibility:visible!important';
      pop.querySelectorAll('.ad-cell').forEach(function(c){if(!c.classList.contains('empty'))c.style.cssText='display:block!important;visibility:visible!important;padding:5px 0;font-size:11.5px;border:none;background:transparent;color:var(--txt);border-radius:6px;cursor:pointer';});
      pop.querySelectorAll('.ad-dowc').forEach(function(c){c.style.cssText='display:block!important;visibility:visible!important;text-align:center;font-size:9.5px;color:var(--muted);font-weight:600';});
    }}catch(e){}
  const a=_adState&&_adState.anchor,W=innerWidth,H=innerHeight,w=pop.offsetWidth,h=pop.offsetHeight,M=8;
  if(!a||!document.body.contains(a)){pop.style.left=Math.max(M,(W-w)/2)+'px';pop.style.top=Math.max(M,(H-h)/2)+'px';return;}
  const r=a.getBoundingClientRect();
  let left=r.left,top=r.bottom+6;
  if(left+w>W-M)left=W-w-M; if(left<M)left=M;
  if(top+h>H-M){const arriba=r.top-h-6;top=arriba>=M?arriba:Math.max(M,H-h-M);}
  pop.style.left=Math.round(left)+'px';pop.style.top=Math.round(top)+'px';
}

// Calcula lo que paga el cliente: por cada pago, base + (7% tax si la financiera lo lleva) + fee de la financiera
function _ventaCalc(){
  let base=0,tax=0,fee=0;const lineas=[];
  let total=0;
  _venta.pagos.forEach(p=>{
    const m=parseFloat(p.monto)||0;let t=0,f=0,fin=null,resta=false;
    if(p.metodo==='financiado'){
      // La financiera presta el monto y le descuenta tax+fee → el negocio recibe MENOS
      resta=true;
      if(p.financiera&&_FINBY[p.financiera]){fin=_FINBY[p.financiera];t=fin.tax?m*0.07:0;f=m*fin.fee;}
    }else if(p.metodo==='zelle'||p.metodo==='debito'||p.metodo==='credito'){
      t=m*0.07; // tarjeta/zelle: el cliente paga 7% de taxes de más (el cash no lleva)
    }
    const lt=resta?(m-t-f):(m+t+f);
    base+=m;tax+=t;fee+=f;total+=lt;lineas.push({p,m,t,f,fin,resta,total:lt});
  });
  return {base,tax,fee,total,lineas};
}
function _ventaCalcHTML(){
  const c=_ventaCalc();
  let h='<div class="v-calc-t">Total de la venta</div>';
  c.lineas.forEach(L=>{
    if(!L.m)return;
    const label=_VMETLBL[L.p.metodo]||L.p.metodo;
    const fin=(L.p.metodo==='financiado'&&L.p.financiera)?' · '+L.p.financiera:'';
    const sg=L.resta?'−':'+';
    const extra=[];if(L.t)extra.push(sg+'7% tax');if(L.f)extra.push(sg+_pctLabel(L.fin.fee)+' fee');
    h+='<div class="v-calc-ln"><span>'+esc(label+fin)+' · $'+_money(L.m)+(extra.length?' <span class="v-calc-x">('+extra.join(' ')+')</span>':'')+'</span><b>$'+_money(L.total)+'</b></div>';
  });
  h+='<div class="v-calc-tot"><span>Le queda a la empresa</span><b>$'+_money(c.total)+'</b></div>';
  const prod=_ventaSum(_venta.productos,'precio');
  if(prod){
    h+='<div class="v-calc-rec"><span>Precio de venta</span><span>$'+_money(prod)+'</span></div>';
    const diff=Math.round((c.total-prod)*100)/100;
    if(diff>0.009)h+='<div class="v-calc-warn">▲ Sobran $'+_money(diff)+' (le entra de más al precio)</div>';
    else if(diff<-0.009)h+='<div class="v-calc-warn">▼ Faltan $'+_money(-diff)+' para llegar al precio</div>';
    else h+='<div class="v-calc-ok">✓ Justo: le entra el precio exacto</div>';
  }
  if(_venta.pagos.some(p=>p.metodo==='financiado'&&!p.financiera))h+='<div class="v-calc-note">⚠️ Elegí la financiera para calcular su fee.</div>';
  return h;
}

async function _subirDocs(imgs){

// Cache de imágenes de documentos (blob) — se cargan con la sesión, no van dentro de clientes.json
const _docBlobs={};
function hydrateVentaDocs(){
  document.querySelectorAll('img.vr-doc[data-doc]').forEach(img=>{
    if(img.dataset.loaded)return;
    const id=img.getAttribute('data-doc');
    img.dataset.loaded='1';
    if(_docBlobs[id]){img.src=_docBlobs[id];return;}
    api('/api/vdoc?id='+encodeURIComponent(id)).then(r=>r.ok?r.blob():null).then(b=>{
      if(!b)return;const url=URL.createObjectURL(b);_docBlobs[id]=url;
      const el=document.querySelector('img.vr-doc[data-doc="'+id+'"]');if(el)el.src=url;
    }).catch(()=>{});
  });
}

// Momento real en que entro la consulta: ultimo mensaje recibido, si no la marca de creacion.
function _consultaTs(c){
  const hh=h=>{h=String(h||'').trim();if(!/^\d{1,2}:\d{2}/.test(h))return '00:00';return h.length===4?('0'+h):h.slice(0,5);};
  const ms=(c.mensajes||[]);
  if(ms.length){const m=ms[ms.length-1];const t=Date.parse((m.fecha||'')+'T'+hh(m.hora)+':00');if(!isNaN(t))return t;}
  if(c.creadoTs){const n=Number(c.creadoTs);if(n)return n;}
  const t2=Date.parse((c.creado||c.ultimoContacto||'')+'T00:00:00');
  return isNaN(t2)?0:t2;
}
function _haceCuanto(ts){
  if(!ts)return '';
  const min=Math.floor((Date.now()-ts)/60000);
  if(min<1)return 'recién';
  if(min<60)return 'hace '+min+' min';
  const hs=Math.floor(min/60); if(hs<24)return 'hace '+hs+' h';
  const d=Math.floor(hs/24); if(d===1)return 'ayer';
  if(d<7)return 'hace '+d+' días';
  return fmtFecha(new Date(ts).toISOString().slice(0,10));
}
let _ncQ='';
function _soloDig(v){v=String(v==null?'':v);let o='';for(let i=0;i<v.length;i++){const k=v.charCodeAt(i);if(k>=48&&k<=57)o+=v[i];}return o;}
// Busca por nombre o por cualquier tramo del numero de corrido (ej: los ultimos 4 digitos)
function _ncMatch(c,q){
  q=String(q||'').trim();if(!q)return true;
  const nom=String(c.nombre||'').toLowerCase();
  if(nom.indexOf(q.toLowerCase())>=0)return true;
  const qd=_soloDig(q);
  if(qd){const nd=_soloDig(c.whatsapp||'');if(nd&&nd.indexOf(qd)>=0)return true;}
  return false;
}

function _ncRows(){
  const cont=document.getElementById('nc-list');if(!cont)return;

  if(sub)sub.textContent=_ncQ?(list.length+' de '+all.length+' consulta(s) coinciden con la búsqueda.'):(all.length+' consulta(s) sin atender. Tocá una para atenderla y empezar a cargar notas, interés y etiquetas.');

function _ventasList(){return clientes.filter(c=>!c.borrado&&!c.descartado&&(c.etapa==='vendido'||c.etapa==='posventa')).sort((a,b)=>String(b.vendidoFecha||'').localeCompare(String(a.vendidoFecha||'')));}
function _entList(v,who){if(!v)return [];if(who==='comprador')return v.compradores||(v.comprador?[v.comprador]:[]);return v.receptores||(v.receptor?[v.receptor]:[]);}
function _tieneDocs(c){const v=c.venta;if(!v)return false;
  const has=arr=>arr.some(e=>(e.docs&&e.docs.length));
  return !!(has(_entList(v,'comprador'))||has(_entList(v,'receptor'))||(v.compradorDocs&&v.compradorDocs.length)||(v.receptorDocs&&v.receptorDocs.length)||(v.pagos&&v.pagos.some(p=>p.comprobante)));}
function _ventaProdStr(c){return (c.venta&&c.venta.productos&&c.venta.productos.length)?c.venta.productos.map(p=>p.producto+(p.detalle?' '+p.detalle:'')).join(', '):(c.ventaDetalle||c.producto||'');}
function _ventaTotal(c){return Number((c.venta&&c.venta.cobro&&c.venta.cobro.total)||c.valor||0);}
function _baseProd(c){const v=c.venta;if(v&&v.productos&&v.productos.length)return v.productos.reduce((s,p)=>s+(Number(p.precio)||0),0);return Number((v&&v.total)||c.valor||0);}
function _taxesV(c){return Number((c.venta&&c.venta.cobro&&c.venta.cobro.tax)||0);}
function _envioV(c){return Number((c.venta&&c.venta.envio)||0);}
// Monto total que paga el cliente = productos + taxes (0 si fue todo cash) + envío
function _montoTotal(c){return Math.round((_baseProd(c)+_taxesV(c)+_envioV(c))*100)/100;}
function _recepCompleta(c){const v=c.venta;if(!v)return false;const comps=_entList(v,'comprador'),recs=_entList(v,'receptor');const okC=comps.length>0&&comps.every(e=>e.docs&&e.docs.length);const okR=recs.length>0&&recs.every(e=>e.docs&&e.docs.length);return okC&&okR;}
function _bajoMin(c){const prods=(c.venta&&c.venta.productos)||[];return prods.some(p=>{const inv=INVENTARIO.find(x=>x.nombre===(p.detalle||'···')||x.nombre===(p.producto||'···'));return inv&&inv.precioMin&&(Number(p.precio)||0)<Number(inv.precioMin);});}
function _setEnvio(id,val){const c=clientes.find(x=>x.id===id);if(!c||!c.venta||!_esAdminRol())return;c.venta.envio=Math.round((parseFloat(val)||0)*100)/100;c.fondeada=(_pagoEstado(c).estado==='PAGADO');_savCliente(c);_vfApply();}
function _pagoEstado(c){
  const total=_montoTotal(c);
  const pagos=(c.venta&&c.venta.pagos)||[];
  const acred=pagos.reduce((s,p)=>s+(p.acreditado?(Number(p.monto)||0):0),0);
  const saldo=Math.round((total-acred)*100)/100;
  const estado=acred<=0?'PENDIENTE':(saldo>0.009?'PARCIAL':'PAGADO');
  return {total,acred,saldo,estado};
}
function _padNum(n){return String(n||0).padStart(3,'0');}
function _maxVentaNum(){return clientes.reduce((m,x)=>Math.max(m,x.ventaNum||0),0);} // incluye borradas → los números no se reutilizan
// Asigna N° SOLO a las ventas que no lo tengan (permanente, nunca renumera). El más antiguo primero.
function _backfillVentaNums(){
  if(!_esAdminRol())return;
  const vs=clientes.filter(c=>!c.borrado&&(c.etapa==='vendido'||c.etapa==='posventa')&&!c.ventaNum);
  if(!vs.length)return;
  let maxN=_maxVentaNum();
  vs.sort((a,b)=>(a.creadoTs||Date.parse(a.creado||0)||0)-(b.creadoTs||Date.parse(b.creado||0)||0)||String(a.vendidoFecha||'').localeCompare(String(b.vendidoFecha||'')));
  vs.forEach(c=>{c.ventaNum=++maxN;_savCliente(c);});
}

  acred:[['','Todas'],['PENDIENTE','PENDIENTE'],['ACREDITADO','ACREDITADO'],['ANULADO','ANULADO']]
};

function _dMinus(days){const d=new Date();d.setDate(d.getDate()-days);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function _vfMatch(c){
  const v=_vf;
  if(v.q){
    const comps=_entList(c.venta,'comprador').map(_entNom).filter(Boolean).join(' ');
    const recs=_entList(c.venta,'receptor').map(_entNom).filter(Boolean).join(' ');
    const num=c.ventaNum?(_padNum(c.ventaNum)+' '+c.ventaNum):'';
    const s=(num+' '+c.nombre+' '+comps+' '+recs+' '+nombreVend(c.vendedorId)+' '+_colabNom(c)+' '+_ventaProdStr(c)).toLowerCase();
    if(s.indexOf(v.q)<0)return false;
  }
  if(v.vend&&c.vendedorId!==v.vend)return false;
  const f=c.vendidoFecha||'';
  if(v.desde&&(!f||f<v.desde))return false;
  if(v.hasta&&(!f||f>v.hasta))return false;
  if(v.estadoVenta&&_estadoVenta(c)!==v.estadoVenta)return false;
  if(v.estadoPago&&_pagoEstado(c).estado!==v.estadoPago)return false;
  if(v.medioPago){const pagos=(c.venta&&c.venta.pagos)||[];
    if(v.medioPago==='SIN PAGOS'){if(pagos.length)return false;}
    else if(!pagos.some(p=>_MEDIO_MAP[p.metodo]===v.medioPago))return false;}
  if(v.acred&&_acredState(c)!==v.acred)return false;
  if(v.financiera){const pagos=(c.venta&&c.venta.pagos)||[];if(!pagos.some(p=>p.metodo==='financiado'&&p.financiera===v.financiera))return false;}
  return true;
}

/* ---- GESTIÓN DE INVENTARIO (admin) ---- */
function _invPersist(){if(SERVER)api('/api/inventario',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(INVENTARIO)}).catch(()=>{});}
function _invRenum(){const order={moto:0,triciclo:1,kit:2};INVENTARIO.sort((a,b)=>(order[a.cat]||0)-(order[b.cat]||0));INVENTARIO.forEach((p,i)=>p.n=i+1);}
let _invSel=new Set();
let _invSelMode=false;
let _aj={subir:true,tipo:'pct'};
function _canEditInv(){return !!(me&&(me.rol==='admin'||me.rol==='supervisor'||me.rol==='dueno'));}
function _invSelModeToggle(){_invSelMode=!_invSelMode;if(!_invSelMode)_invSel=new Set();render();}
function _invSelAll(){const all=_invSel.size===INVENTARIO.length;INVENTARIO.forEach((p,i)=>{if(all)_invSel.delete(i);else _invSel.add(i);});render();}
let _invQ='';let _invFiltro='todos';
function _invActivo(p){return p.activo!==false;}
function _invMoney(n){return '$'+Number(n||0).toLocaleString('es-AR');}
function _invFiltrada(){
  return INVENTARIO.map((p,idx)=>({p,idx})).filter(({p})=>{
    if(['moto','triciclo','kit'].indexOf(_invFiltro)>=0&&p.cat!==_invFiltro)return false;
    if(_invFiltro==='activos'&&!_invActivo(p))return false;
    if(_invFiltro==='inactivos'&&_invActivo(p))return false;
    if(_invQ){const s=[p.n,p.nombre,p.modelo,p.marca,p.motor,p.color].map(x=>String(x||'')).join(' ').toLowerCase();if(s.indexOf(_invQ)<0)return false;}
    return true;
  });
}
function renderInventario(){

  const cols=(sel?['✓']:[]).concat(['N°','Producto','Modelo','Categoría','Marca','Motor','Watts','Kw','Colores','Precio','Mínimo','Comisión','Envío','Estado','']);
  h+='<div class="vtbl-wrap"><table class="vtbl"><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody id="inv-tbody"></tbody></table></div>';
  h+='<div class="sub" id="inv-foot" style="margin-top:8px"></div>';

function _invSetFiltro(k){_invFiltro=k;document.querySelectorAll('.fin-tab').forEach(b=>b.classList.toggle('on',b.dataset.k===k));_invRenderRows();}

    +'<td>'+esc(dash(p.motor))+'</td>'

    +'<td class="num">'+num(p.kw)+'</td>'
    +'<td>'+esc(dash(p.color))+'</td>'

    +'<td class="num">'+(Number(p.comision)>0?_invMoney(p.comision):'—')+'</td>'

        ?'<button class="vt-ic" style="background:#007aff" title="Ver / fotos" onclick="verProducto('+idx+')">👁</button> <button class="vt-ic" style="background:#ff9f0a" title="Editar" onclick="_invModal('+idx+')">✏️</button> <button class="vt-ic vt-del" title="Eliminar" onclick="_invDel('+idx+')">🗑️</button>'
        :'<button class="vt-ic" style="background:#007aff" title="Ver / fotos" onclick="verProducto('+idx+')">👁</button>')
    +'</td>'
    +'</tr>';});
    tb.innerHTML=html;}
  const foot=document.getElementById('inv-foot');if(foot)foot.textContent=rows.length?(rows.length+' producto(s)'):'Sin resultados';
  try{_segSlideAll();}catch(e){}

    +(function(){const specs=[];if(p.modelo)specs.push(['Modelo',p.modelo]);if(p.marca)specs.push(['Marca',p.marca]);if(p.motor)specs.push(['Motor',p.motor]);if(Number(p.cc)>0)specs.push(['Cil. CC',Number(p.cc).toLocaleString('es-AR')]);if(Number(p.watts)>0)specs.push(['Watts',Number(p.watts).toLocaleString('es-AR')]);if(Number(p.kw)>0)specs.push(['Kw',Number(p.kw).toLocaleString('es-AR')]);if(Number(p.precioMin)>0)specs.push(['Precio mínimo','$'+Number(p.precioMin).toLocaleString('es-AR')]);if(Number(p.comision)>0)specs.push(['Comisión','$'+Number(p.comision).toLocaleString('es-AR')]);if(Number(p.envio)>0)specs.push(['Envío','$'+Number(p.envio).toLocaleString('es-AR')]);return specs.length?'<div class="prod-specs">'+specs.map(s=>'<div class="ps-row"><span class="ps-k">'+esc(s[0])+'</span><span class="ps-v">'+esc(String(s[1]))+'</span></div>').join('')+'</div>':'';})()

function _descargarImg(id,nombre){const src=_docBlobs[id];if(!src){alert('Esperá a que cargue la imagen.');return;}const a=document.createElement('a');a.href=src;a.download=((nombre||'imagen').replace(/[^a-z0-9]+/gi,'_'))+'.jpg';document.body.appendChild(a);a.click();a.remove();}
async function _prodImgAdd(idx,input){

}

function _invToggleSel(idx,on){if(on)_invSel.add(idx);else _invSel.delete(idx);_invUpdateBulk();}

function _invSelCat(cat){const idxs=INVENTARIO.map((p,i)=>p.cat===cat?i:-1).filter(i=>i>=0);const allSel=idxs.every(i=>_invSel.has(i));idxs.forEach(i=>{if(allSel)_invSel.delete(i);else _invSel.add(i);});render();}

function _ajDir(subir){_aj.subir=subir;document.getElementById('aj-up').classList.toggle('on',subir);document.getElementById('aj-dn').classList.toggle('on',!subir);_ajPrev();}

function _ajPrev(){const el=document.getElementById('aj-prev');if(!el)return;const val=parseFloat(document.getElementById('aj-val').value)||0;if(!val){el.textContent='';return;}const idxs=[..._invSel].slice(0,3);const ej=idxs.map(i=>{const p=INVENTARIO[i];return p?esc(p.nombre)+': $'+p.precio.toLocaleString('es-AR')+' → $'+_ajCalc(p.precio,val).toLocaleString('es-AR'):'';}).filter(Boolean).join('<br>');el.innerHTML='Ejemplo:<br>'+ej+(_invSel.size>3?'<br>…y '+(_invSel.size-3)+' más':'');}

// Números en formato europeo o común: "3.000,00" → 3000 ; "37,00" → 37 ; "2500" → 2500
function _numEU(s){s=String(s==null?'':s).trim();if(!s)return 0;if(/,/.test(s)&&/\./.test(s))s=s.replace(/\./g,'').replace(',','.');else if(/,/.test(s))s=s.replace(',','.');const n=parseFloat(s.replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;}
function _catFrom(s){s=String(s||'').toLowerCase();if(/tric/.test(s))return 'triciclo';if(/kit|ecoflow|solar|panel|bater/.test(s))return 'kit';return 'moto';}
function _parseCsv(text){
  const rows=[];let row=[],cur='',q=false;text=String(text||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else{if(c==='"')q=true;else if(c===','||c===';'){row.push(cur);cur='';}else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}else cur+=c;}
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(x=>String(x).trim()));
}
async function _inflateRaw(u8){const ds=new DecompressionStream('deflate-raw');const buf=await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer();return new Uint8Array(buf);}
async function _unzip(u8){const dv=new DataView(u8.buffer);const files={};let i=0;const td=new TextDecoder();
  while(i<u8.length-4){const sig=dv.getUint32(i,true);
    if(sig===0x04034b50){const method=dv.getUint16(i+8,true),compSize=dv.getUint32(i+18,true),nameLen=dv.getUint16(i+26,true),extraLen=dv.getUint16(i+28,true);
      const name=td.decode(u8.slice(i+30,i+30+nameLen));const start=i+30+nameLen+extraLen;const comp=u8.slice(start,start+compSize);
      files[name]=method===8?await _inflateRaw(comp):comp;i=start+compSize;}
    else if(sig===0x02014b50)break;else i++;}
  return files;}
function _colIdx(ref){const s=ref.replace(/[0-9]/g,'');let n=0;for(let k=0;k<s.length;k++)n=n*26+(s.charCodeAt(k)-64);return n-1;}
function _xmlTxt(x){return x.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#10;/g,' ').replace(/&quot;/g,'"').replace(/&#0?39;/g,"'");}
async function _readXlsxRows(file){
  const u8=new Uint8Array(await file.arrayBuffer());const files=await _unzip(u8);const dec=new TextDecoder();
  let shared=[];if(files['xl/sharedStrings.xml']){const ss=dec.decode(files['xl/sharedStrings.xml']);shared=ss.split('<si>').slice(1).map(si=>_xmlTxt(si.split('</si>')[0]));}
  const key=Object.keys(files).find(k=>/xl\/worksheets\/sheet1\.xml$/.test(k))||Object.keys(files).find(k=>/xl\/worksheets\/.*\.xml$/.test(k));
  const xml=dec.decode(files[key]);const rowsXml=xml.split(/<row[ >]/).slice(1);
  return rowsXml.map(rx=>{const body=rx.split('</row>')[0];const cells=[];const parts=body.split(/<c[ >]/).slice(1);
    parts.forEach(p=>{const rM=p.match(/r="([A-Z]+)\d+"/);const ci=rM?_colIdx(rM[1]):cells.length;const tM=p.match(/\st="([^"]+)"/);const t=tM?tM[1]:'';
      const isM=p.match(/<is>([\s\S]*?)<\/is>/),vM=p.match(/<v>([\s\S]*?)<\/v>/),tX=p.match(/<t[^>]*>([\s\S]*?)<\/t>/);let val='';
      if(t==='inlineStr'&&isM)val=_xmlTxt(isM[1]);else if(t==='s'&&vM)val=shared[parseInt(vM[1],10)]||'';else if(vM)val=_xmlTxt(vM[1]);else if(isM)val=_xmlTxt(isM[1]);else if(tX)val=_xmlTxt(tX[1]);
      cells[ci]=val;});
    return cells;});
}
function _mapInvRows(rows){
  if(!rows||rows.length<2)return [];
  const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
  const head=rows[0].map(norm);
  const find=(...keys)=>{for(const k of keys){const i=head.indexOf(k);if(i>=0)return i;}return -1;};
  const C={nombre:find('producto','nombre'),modelo:find('modelo'),cat:find('categoria','cat'),marca:find('marca'),motor:find('motor'),cc:find('cilcc','cc','cilindrada'),watts:find('watts'),kw:find('kw'),color:find('colores','color'),precio:find('precioventausd','precioventa','precio'),precioMin:find('preciominimousd','preciominimo','minimo'),comision:find('comisionusd','comision'),envio:find('enviousd','envio'),activo:find('activo','estado')};
  const out=[];
  for(let r=1;r<rows.length;r++){const row=rows[r]||[];const g=i=>i>=0?String(row[i]||'').trim():'';
    const nombre=g(C.nombre);if(!nombre)continue;const av=g(C.activo).toLowerCase();
    out.push({nombre,modelo:g(C.modelo),cat:_catFrom(g(C.cat)),marca:g(C.marca),motor:g(C.motor),cc:_numEU(g(C.cc)),watts:_numEU(g(C.watts)),kw:_numEU(g(C.kw)),color:g(C.color),precio:_numEU(g(C.precio)),precioMin:_numEU(g(C.precioMin)),comision:_numEU(g(C.comision)),envio:_numEU(g(C.envio)),activo:C.activo<0?true:!/^(false|0|no|inactivo)$/.test(av)});
  }
  return out;
}
async function _invImportGo(f){
  const name=(f.name||'').toLowerCase();
  const esTabla=name.endsWith('.xlsx')||name.endsWith('.xls')||name.endsWith('.csv')||f.type==='text/csv';
  if(esTabla){
    _importModal('<div style="text-align:center;padding:24px 10px"><div class="imp-spin"></div><div style="margin-top:10px;color:var(--muted);font-size:13.5px">Leyendo la planilla…</div></div>',true);
    try{
      const rows=(name.endsWith('.csv')||f.type==='text/csv')?_parseCsv(await f.text()):await _readXlsxRows(f);
      const prods=_mapInvRows(rows);
      if(!prods.length)throw new Error('sin productos');
      _importPreview(prods);return;
    }catch(e){/* si falla el parseo directo, probamos con IA */}
  }
  _invImportAI(f);

async function _invImportAI(f){
  _importModal('<div style="text-align:center;padding:24px 10px"><div class="imp-spin"></div><div style="margin-top:10px;color:var(--muted);font-size:13.5px">Leyendo el archivo con IA…<br>Puede tardar unos segundos.</div></div>',true);
  try{
    const name=(f.name||'').toLowerCase();let body;
    if(name.endsWith('.csv')||f.type==='text/csv'){body={text:await f.text()};}
    else{body={data:await _fileToB64(f),mime:f.type||''};}
    const r=await api('/api/import-inventario',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    if(!j||!j.ok||!j.productos||!j.productos.length){_importModal('<div style="padding:14px 4px;font-size:13.5px">⚠️ '+esc((j&&j.reason)||'No pude leer productos del archivo.')+'</div>',false,'<button class="btn ghost" onclick="cerrarImport()">Cerrar</button><button class="btn" onclick="_invImport()">Probar otro archivo</button>');return;}
    _importPreview(j.productos);
  }catch(e){_importModal('<div style="padding:14px 4px">⚠️ Error al procesar el archivo.</div>',false,'<button class="btn ghost" onclick="cerrarImport()">Cerrar</button>');}

function _invImportApply(modo){
  if(!_importProds)return;
  const clean=p=>({nombre:p.nombre,cat:p.cat||'moto',modelo:p.modelo||'',marca:p.marca||'',motor:p.motor||'',cc:Number(p.cc)||0,watts:Number(p.watts)||0,kw:Number(p.kw)||0,color:p.color||'',precio:Number(p.precio)||0,precioMin:Number(p.precioMin)||0,comision:Number(p.comision)||0,envio:Number(p.envio)||0,activo:p.activo!==false});

  else{_importProds.forEach(np=>{const ex=INVENTARIO.find(p=>(p.nombre||'').toLowerCase()===String(np.nombre).toLowerCase()&&p.cat===np.cat);if(ex){Object.assign(ex,clean(np),{imagenes:ex.imagenes,info:ex.info});}else INVENTARIO.push(clean(np));});}

}

let _finQ='';let _finFiltro='todas';
function _finActiva(f){return f.activa!==false;}
function _finConfig(f){return Number(f.fee)>0||!!f.tax||(f.diasSel&&f.diasSel.length&&f.diasSel.length<7)||!!(f.cuotas&&String(f.cuotas).trim());}
function _finTieneCuotas(f){return !!(f.cuotas&&String(f.cuotas).trim());}

// Puede editar el catalogo de financieras: admin, supervisor y dueno. El vendedor solo consulta.
function _canEditFin(){return !!(me&&(me.rol==='admin'||me.rol==='supervisor'||me.rol==='dueno'));}
function _finDiasDe(f){return (f.diasSel&&f.diasSel.length)?f.diasSel:_parseDias(f.dias);}
function _finHoyNombre(){return _DIAS_SEM[(new Date().getDay()+6)%7];}

function _finHoyDisp(f){return _finActiva(f)&&_finDiasDe(f).indexOf(_finHoyNombre())>=0;}

function _parseDias(str){
  str=(str||'').trim();
  if(!str||/todos/i.test(str))return _DIAS_SEM.slice();
  const norm=x=>({mie:'Mié',sab:'Sáb'}[x.toLowerCase()]||(x[0].toUpperCase()+x.slice(1).toLowerCase()));
  const m=str.match(/(Lun|Mar|Mié|Mie|Jue|Vie|Sáb|Sab|Dom)\s+a\s+(Lun|Mar|Mié|Mie|Jue|Vie|Sáb|Sab|Dom)/i);
  if(m){const a=_DIAS_SEM.indexOf(norm(m[1])),b=_DIAS_SEM.indexOf(norm(m[2]));if(a>=0&&b>=0&&a<=b)return _DIAS_SEM.slice(a,b+1);}
  const found=_DIAS_SEM.filter(d=>str.indexOf(d)>=0);
  return found.length?found:_DIAS_SEM.slice();
}

function _mondayOf(dstr){const d=new Date(dstr+'T00:00:00');const dw=(d.getDay()+6)%7;d.setDate(d.getDate()-dw);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function _inChartItems(){
  const activas=clientes.filter(c=>!c.borrado&&!c.descartado&&!c.anulada&&(c.etapa==='vendido'||c.etapa==='posventa'));
  const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];const items=[];
  if(_inMode==='dia'){
    const days=_pvDays(hoy().slice(0,8)+'01',hoy());const m={};days.forEach(d=>m[d]={c:0,mo:0});
    activas.forEach(c=>{const f=(c.vendidoFecha||'').slice(0,10);if(m[f]){m[f].c++;m[f].mo+=_montoTotal(c);}});
    days.forEach(d=>items.push({label:fmtFecha(d).slice(0,5),full:fmtFecha(d),count:m[d].c,monto:m[d].mo}));
  }else if(_inMode==='sem'){
    const anchor=_mondayOf(hoy());const weeks=[];const d=new Date(anchor+'T00:00:00');d.setDate(d.getDate()-7*11);
    for(let i=0;i<12;i++){weeks.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));d.setDate(d.getDate()+7);}
    const m={};weeks.forEach(w=>m[w]={c:0,mo:0});
    activas.forEach(c=>{const f=(c.vendidoFecha||'').slice(0,10);if(!f)return;const w=_mondayOf(f);if(m[w]){m[w].c++;m[w].mo+=_montoTotal(c);}});
    weeks.forEach(w=>{const dt=new Date(w+'T00:00:00');items.push({label:String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0'),full:'Semana del '+fmtFecha(w),count:m[w].c,monto:m[w].mo});});
  }else{
    const now=new Date(hoy()+'T00:00:00'),months=[];
    for(let i=11;i>=0;i--){let yy=now.getFullYear(),mm=now.getMonth()-i;while(mm<0){mm+=12;yy--;}months.push(yy+'-'+String(mm+1).padStart(2,'0'));}
    const m={};months.forEach(k=>m[k]={c:0,mo:0});
    activas.forEach(c=>{const f=(c.vendidoFecha||'').slice(0,7);if(m[f]){m[f].c++;m[f].mo+=_montoTotal(c);}});
    months.forEach(k=>{const mm=Number(k.slice(5,7))-1;items.push({label:MES[mm]+" '"+k.slice(2,4),full:MES[mm]+' '+k.slice(0,4),count:m[k].c,monto:m[k].mo});});
  }

function _inBars(items){
  if(!items.length)return '<div class="faint" style="padding:30px;text-align:center">Sin datos.</div>';
  const W=720,H=240,pL=34,pR=12,pT=12,pB=28,pw=W-pL-pR,ph=H-pT-pB,n=items.length;
  let maxY=1;items.forEach(it=>maxY=Math.max(maxY,it.count));maxY=_niceMax(maxY);
  const gw=pw/n,bw=Math.max(3,Math.min(34,gw*0.6)),Y=v=>pT+ph-(v/maxY)*ph,step=n>14?Math.ceil(n/10):1;
  let g='';for(let k=0;k<=4;k++){const val=maxY*k/4,yy=Y(val);g+='<line x1="'+pL+'" y1="'+yy+'" x2="'+(W-pR)+'" y2="'+yy+'" stroke="var(--grid)" stroke-dasharray="3 3"/><text x="'+(pL-6)+'" y="'+(yy+3.5)+'" text-anchor="end" font-size="9" fill="var(--muted)">'+Math.round(val)+'</text>';}
  items.forEach((it,i)=>{if(i%step===0||i===n-1){const gx=pL+i*gw+gw/2;g+='<line x1="'+gx+'" y1="'+pT+'" x2="'+gx+'" y2="'+(pT+ph)+'" stroke="var(--grid)" stroke-dasharray="3 3"/>';}});
  let bars='';items.forEach((it,i)=>{const cx=pL+i*gw+gw/2,x=cx-bw/2,c=it.count,y=Y(c),hh=Math.max(0,pT+ph-y);
    const tip=_pvJs(it.full||it.label)+'<br>'+_pvJs(c+' venta'+(c===1?'':'s'))+'<br>'+_pvJs('$'+Number(Math.round(it.monto||0)).toLocaleString('es-AR'));
    bars+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+hh+'" rx="2" fill="#3a7bd5" onmousemove="_pvTip(event,\''+tip+'\')" onmouseleave="_pvTipHide()"/>';});
  let xl='';items.forEach((it,i)=>{if(i%step===0||i===n-1)xl+='<text x="'+(pL+i*gw+gw/2)+'" y="'+(H-9)+'" text-anchor="middle" font-size="8" fill="var(--muted)">'+esc(it.label)+'</text>';});
  return '<svg viewBox="0 0 '+W+' '+H+'" class="pv-svg" preserveAspectRatio="xMidYMid meet">'+g+bars+xl+'</svg>';
}

// Comisión oficial: comisión base del inventario + (precio de venta − precio de lista)/2, piso 0.

function _comisionProd(p,invMap){const inv=(invMap||{})[p.detalle]||(invMap||{})[p.producto]||INVENTARIO.find(x=>x.nombre===(p.detalle||'·')||x.nombre===(p.producto||'·'));if(!inv)return 0;const base=Number(inv.precio)||0,comBase=Number(inv.comision)||0,venta=Number(p.precio)||0;return Math.max(0,comBase+(venta-base)/2);}
function _comisionWizardCalc(){const invMap={};(INVENTARIO||[]).forEach(x=>{invMap[x.nombre]=x;});let s=0;((_venta&&_venta.productos)||[]).forEach(p=>{s+=_comisionProd({detalle:p.detalle,producto:p.producto,precio:parseFloat(p.precio)||0},invMap);});return Math.round(s*100)/100;}

    const xi2=cx+rI*Math.cos(a2),yi2=cy+rI*Math.sin(a2),xi1=cx+rI*Math.cos(a),yi1=cy+rI*Math.sin(a);

function _pedDir(rec){return [rec.direccion,rec.municipio,rec.provincia,rec.pais||'Cuba'].map(x=>String(x||'').trim()).filter(Boolean).join(' - ');}
function _tipoDe(cat){return (cat==='moto'||cat==='triciclo')?'VEHICULO':(cat==='kit'?'ENERGIA':'OTRO');}
function _pedList(){
  const out=[];const invMap={};(INVENTARIO||[]).forEach(x=>{invMap[x.nombre]=x;});
  clientes.filter(c=>!c.borrado&&!c.descartado&&!c.anulada&&(c.etapa==='vendido'||c.etapa==='posventa')).forEach(c=>{
    const v=c.venta;if(!v)return;
    const recs=_entList(v,'receptor');
    const clienteUSA=(_entNom(_entList(v,'comprador')[0])||c.nombre||'');
    (v.productos||[]).forEach((p,pi)=>{
      let ri=Number(p.receptorIdx)||0;if(ri>=recs.length)ri=0;const rec=recs[ri]||{};

        fecha:c.vendidoFecha||'',articulo:(p.detalle||p.producto||''),cantidad:1,
        codigo:inv?inv.n:'',cat:inv?inv.cat:'',tipo:_tipoDe(inv?inv.cat:''),
        clienteUSA,receptor:_entNom(rec)||'',ci:rec.carnet||'',provincia:(rec.provincia||''),municipio:(rec.municipio||''),
        zona:(rec.zona||''),direccion:_pedDir(rec),telefono:(rec.telefono||''),track:(rec.track||''),orden:(p.orden||'')});
    });
  });
  return out;
}

function _adbStackSVG(days,dayData,series){

function _adbDonut(segs){
  const total=segs.reduce((s,x)=>s+(x.value||0),0);
  if(total<=0)return '<div class="faint" style="padding:40px;text-align:center">Sin datos.</div>';
  const cx=150,cy=120,rO=88,rI=54;let a=-Math.PI/2,arcs='',labels='';

    labels='<text x="'+cx+'" y="'+(cy-rO-7)+'" text-anchor="middle" font-size="11" font-weight="700" fill="'+pos[0].color+'">'+pos[0].value+'</text>';}
  else segs.forEach(sg=>{if(sg.value<=0)return;const frac=sg.value/total,a2=a+frac*Math.PI*2,mid=(a+a2)/2;
    const x1=cx+rO*Math.cos(a),y1=cy+rO*Math.sin(a),x2=cx+rO*Math.cos(a2),y2=cy+rO*Math.sin(a2);
    const xi2=cx+rI*Math.cos(a2),yi2=cy+rI*Math.sin(a2),xi1=cx+rI*Math.cos(a),yi1=cy+rI*Math.sin(a);
    const large=frac>0.5?1:0;
    arcs+='<path d="M '+x1+' '+y1+' A '+rO+' '+rO+' 0 '+large+' 1 '+x2+' '+y2+' L '+xi2+' '+yi2+' A '+rI+' '+rI+' 0 '+large+' 0 '+xi1+' '+yi1+' Z" fill="'+sg.color+'" onmousemove="_pvTip(event,\''+_pvJs(sg.label+' : '+sg.value+' ('+Math.round(frac*100)+'%)')+'\')" onmouseleave="_pvTipHide()"/>';
    const lx=cx+rO*Math.cos(mid),ly=cy+rO*Math.sin(mid),ex=cx+(rO+13)*Math.cos(mid),ey=cy+(rO+13)*Math.sin(mid);
    const right=Math.cos(mid)>=0;const tx=ex+(right?4:-4);
    labels+='<line x1="'+lx+'" y1="'+ly+'" x2="'+ex+'" y2="'+ey+'" stroke="'+sg.color+'" stroke-width="1"/><text x="'+tx+'" y="'+(ey+3.5)+'" text-anchor="'+(right?'start':'end')+'" font-size="10.5" font-weight="700" fill="'+sg.color+'">'+sg.value+'</text>';
    a=a2;});
  const svg='<svg viewBox="0 0 300 240" class="pv-svg" preserveAspectRatio="xMidYMid meet" style="max-height:240px">'+arcs+labels+'</svg>';
  const leg='<div class="fz-legend">'+segs.filter(s=>s.value>0).map(sg=>'<span><i style="background:'+sg.color+'"></i>'+esc(sg.label)+'</span>').join('')+'</div>';
  return svg+leg;
}

function _adbBuild(){
  const rows=_adbFiltered();
  const k={tot:rows.length,alta:0,mod:0,anu:0,eli:0,err:0};
  const days={},byU={},byM={};
  rows.forEach(e=>{
    const acc=e.accion;

/* ---- ESTADO DE AGENDA (atrasado/hoy/próximos/semana) con 15 min de tolerancia ---- */
function proxDateTime(c){if(!c.proximo)return null;const h=(c.proximoHora&&/^\d{1,2}:\d{2}/.test(c.proximoHora))?c.proximoHora:'23:59';return new Date(c.proximo+'T'+(h.length===4?'0'+h:h)+':00');}
// Los cajones NO son excluyentes: un cliente de hoy con la hora ya pasada
// está en Atrasados Y en Hoy a la vez.
function esAtrasado(c){const dt=proxDateTime(c);return !!dt&&!isNaN(dt)&&dt.getTime()<Date.now()-15*60000;}
function esHoy(c){return !!c.proximo&&c.proximo===hoy();}
function diasA(c){if(!c.proximo)return null;return Math.round((new Date(c.proximo+'T00:00:00')-new Date(hoy()+'T00:00:00'))/86400000);}
function enBucket(c,b){
  if(!c.proximo)return false;
  // Un cliente vendido/posventa sale de las carpetas de agenda, salvo que tenga la etiqueta "seguimiento"
  if((c.etapa==='vendido'||c.etapa==='posventa')&&!(c.tags&&c.tags.includes('seguimiento')))return false;
  if(b==='atrasado')return esAtrasado(c);
  if(b==='hoy')return esHoy(c);
  if(b==='proximos'){const d=diasA(c);return d>=1&&d<=6;}
  if(b==='semana'){const d=diasA(c);return d>=7;}
  return false;
}
// bucket "principal" (para donde se necesite uno solo)
function estadoAgenda(c){
  if(!c.proximo)return null;
  if(esAtrasado(c))return 'atrasado';
  if(esHoy(c))return 'hoy';
  const d=diasA(c);return (d>=1&&d<=6)?'proximos':'semana';
}

function renderAgenda(){

  const today=hoy();

  if(!list.length){main.innerHTML=h+'<div class="empty">No tenés nada agendado. Programá una llamada o reunión desde la ficha de un cliente 📅</div></div>';return;}
  const groups=[{label:'🔴 Atrasados',f:c=>c.proximo<today},{label:'🟡 Hoy',f:c=>c.proximo===today},{label:'🔵 Próximos',f:c=>c.proximo>today}];

/* ---- Emojis estilo Apple (imágenes desde internet, con respaldo a los de Windows) ---- */
const EMOJI_TEST=/\p{Extended_Pictographic}/u;
const EMOJI_RE=/\p{Extended_Pictographic}(️|\p{Emoji_Modifier})?(‍\p{Extended_Pictographic}(️|\p{Emoji_Modifier})?)*/gu;
function emojiImg(e){return '<img class="emoji" draggable="false" alt="'+e+'" src="https://emojicdn.elk.sh/'+encodeURIComponent(e)+'?style=apple" onerror="this.replaceWith(document.createTextNode(this.alt))">';}
function emojify(root){
  if(!root)return;
  const skip={SCRIPT:1,STYLE:1,TEXTAREA:1,INPUT:1,OPTION:1,SELECT:1,IMG:1,SVG:1};
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    if(!n.nodeValue||!EMOJI_TEST.test(n.nodeValue))return NodeFilter.FILTER_REJECT;
    const p=n.parentNode;if(!p||skip[p.nodeName])return NodeFilter.FILTER_REJECT;
    if(p.classList&&p.classList.contains('emoji'))return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  const nodes=[];let n;while(n=walker.nextNode())nodes.push(n);
  for(const node of nodes){
    const val=node.nodeValue;const html=esc(val).replace(EMOJI_RE,m=>emojiImg(m));
    if(html!==val){const span=document.createElement('span');span.innerHTML=html;const kids=[...span.childNodes];node.replaceWith(...kids);}
  }
}
let _emojiMo=null;
function initEmoji(){
  try{emojify(document.body);}catch(e){}
  _emojiMo=new MutationObserver(()=>{_emojiMo.disconnect();try{emojify(document.body);}catch(e){}finally{_emojiMo.observe(document.body,{childList:true,subtree:true});}});
  _emojiMo.observe(document.body,{childList:true,subtree:true});
}
