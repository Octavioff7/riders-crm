<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Riders Miami — CRM</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#262a63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Riders CRM">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<style>
  :root{
    --accent:#007aff;
    --bg:#ffffff;--grouped:#f5f5f7;--card:#ffffff;
    --sidebar:rgba(246,246,248,0.72);--titlebar:rgba(255,255,255,0.72);
    --txt:#1d1d1f;--muted:#86868b;
    --sep:rgba(0,0,0,0.09);--sep-strong:rgba(0,0,0,0.14);--hover:rgba(0,0,0,0.05);
    --in:#ffffff;--out:#007aff;
    --caliente:#ff3b30;--seguimiento:#ff9f0a;--frio:#32ade6;--perdido:#8e8e93;
    --tb:52px;--radius:11px;--desktop:linear-gradient(160deg,#d5dde8 0%,#bcc7d8 100%);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Segoe UI,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body.dark{
      --accent:#0a84ff;
      --bg:#1e1e1e;--grouped:#1c1c1e;--card:#2c2c2e;
      --sidebar:rgba(40,40,42,0.62);--titlebar:rgba(36,36,38,0.72);
      --txt:#f5f5f7;--muted:#98989d;
      --sep:rgba(255,255,255,0.10);--sep-strong:rgba(255,255,255,0.16);--hover:rgba(255,255,255,0.07);
      --in:#3a3a3c;--out:#0a84ff;--desktop:linear-gradient(160deg,#2b2c31 0%,#161619 100%);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);font-size:14px;overflow:hidden;letter-spacing:-0.01em}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.22);border-radius:9px;border:2px solid transparent;background-clip:content-box}
  body.dark ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.24);background-clip:content-box}

  /* WINDOW + TITLEBAR (macOS) */
  .window{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media (prefers-reduced-transparency:reduce){.titlebar,.side,.col-conv,.chat-head,.composer,.asis-head{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}}
  .titlebar{height:var(--tb);flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;background:var(--titlebar);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-bottom:1px solid var(--sep);z-index:20}
  .traffic{position:absolute;left:20px;display:flex;gap:8px}
  .tl{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14);display:grid;place-items:center;border:none;padding:0;cursor:pointer}
  .tl.red{background:#ff5f57}.tl.yellow{background:#febc2e}.tl.green{background:#28c840}
  .tl::before{font-size:9px;font-weight:800;color:rgba(0,0,0,.5);opacity:0;line-height:1}
  .traffic:hover .tl::before{opacity:1}
  .tl.red::before{content:"\00d7"}.tl.yellow::before{content:"\2013"}.tl.green::before{content:"+"}
  body.side-collapsed .side{width:60px}
  body.side-collapsed .brand div,body.side-collapsed nav .lbl,body.side-collapsed nav .count,body.side-collapsed .nav-label,body.side-collapsed .side-foot .demo,body.side-collapsed .side-foot .acct span:not(.a){display:none}
  body.side-collapsed nav button{justify-content:center}
  body.side-collapsed .brand{justify-content:center;padding-left:0;padding-right:0}
  .title{font-size:13px;font-weight:600;color:var(--txt)}
  .theme-toggle{position:absolute;left:80px;background:transparent;border:none;cursor:pointer;font-size:14px;padding:4px 7px;border-radius:7px;line-height:1;transition:background .12s}
  .theme-toggle:hover{background:var(--hover)}
  .shell{flex:1;display:flex;min-height:0}

  /* SIDEBAR */
  .side{width:230px;flex-shrink:0;background:var(--sidebar);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-right:1px solid var(--sep);display:flex;flex-direction:column;padding-top:6px;transition:width .28s cubic-bezier(.32,.72,0,1)}
  .brand{display:flex;align-items:center;gap:10px;padding:8px 18px 12px;color:var(--txt);font-weight:700;font-size:13px}
  .brand .badge{width:28px;height:28px;border-radius:7px;background:#262a63;display:grid;place-items:center;font-size:14px;box-shadow:0 1px 2px rgba(0,0,0,.2);overflow:hidden}
  .badge img{width:100%;height:100%;object-fit:cover;display:block}
  .brand small{display:block;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.4px}
  nav{display:flex;flex-direction:column;gap:1px;padding:6px 10px;flex:1}
  nav button{display:flex;align-items:center;gap:10px;background:transparent;border:none;color:var(--txt);padding:5px 8px;border-radius:7px;font-weight:500;font-size:13.5px;text-align:left;width:100%;transition:background .16s ease}
  nav button .ic{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:13px;flex-shrink:0;box-shadow:0 1px 1px rgba(0,0,0,.18)}
  nav button:nth-of-type(1) .ic{background:#5e5ce6}
  nav button:nth-of-type(2) .ic{background:#34c759}
  nav button:nth-of-type(3) .ic{background:#0a84ff}
  nav button:nth-of-type(4) .ic{background:#ff9f0a}
  nav button:nth-of-type(5) .ic{background:#32ade6}
  nav button:nth-of-type(6) .ic{background:#ff2d55}
  .nav-label{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:8px 12px 4px}
  nav button .count{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted);background:var(--hover);border-radius:9px;padding:0 7px;min-width:20px;height:18px;display:grid;place-items:center}
  nav button.active .count{color:#fff;background:rgba(255,255,255,.28)}
  nav button:hover{background:var(--hover)}
  nav button:active{transform:scale(.98)}
  nav button.active{background:var(--accent);color:#fff}
  nav button.active .ic{background:rgba(255,255,255,.25);box-shadow:none}
  nav .star:hover{color:#fff}
  .side-foot{padding:10px 12px;border-top:1px solid var(--sep)}
  .side-foot .demo{border-radius:7px;padding:5px 9px;font-size:11px;font-weight:600;text-align:center;margin-bottom:10px}
  .side-foot .acct{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--txt);font-weight:500}
  .side-foot .acct .a{width:26px;height:26px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:700;font-size:11px;color:#fff}
  .perfil-btn{display:flex;align-items:center;gap:9px;width:100%;background:transparent;border:none;padding:6px 8px;border-radius:9px;cursor:pointer;color:var(--txt);text-align:left;transition:background .16s ease}
  .perfil-btn:hover{background:var(--hover)}
  .perfil-btn .pf-info{display:flex;flex-direction:column;min-width:0;flex:1}
  .perfil-btn .pf-nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .perfil-btn .pf-rol{font-size:11px;color:var(--muted)}
  .perfil-btn .pf-cog{color:var(--muted);font-size:15px;flex:none}

  main{flex:1;height:100%;overflow:hidden;min-width:0;background:var(--bg)}
  main.scroll{overflow-y:auto}
  .page{padding:28px 34px;max-width:1120px}
  .page h1{margin:0 0 3px;font-size:26px;font-weight:700;letter-spacing:-0.021em}
  .page .sub{color:var(--muted);margin-bottom:22px;font-size:13.5px}
  /* Fluid view transitions (macOS spring-like easing) */
  .anim-in{animation:viewIn .28s cubic-bezier(.32,.72,0,1)}
  @keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* CHAT SHARED */
  .msg{max-width:74%;padding:8px 13px;border-radius:16px;font-size:14px;line-height:1.4}
  .msg .t{font-size:10px;color:var(--muted);margin-top:3px;text-align:right;opacity:.8}
  .msg.in{align-self:flex-start;background:var(--in);border:1px solid var(--sep);border-bottom-left-radius:5px}
  .msg.out{align-self:flex-end;background:var(--out);color:#fff;border-bottom-right-radius:5px}
  .msg.out .t{color:rgba(255,255,255,.75)}
  .composer{display:flex;gap:9px;padding:11px 16px;border-top:1px solid var(--sep);background:var(--titlebar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);align-items:center}
  .composer input{flex:1;background:var(--card);border:1px solid var(--sep-strong);border-radius:18px;padding:9px 15px;color:var(--txt);font-size:14px}
  .composer input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,122,255,.22)}
  .composer .send{width:34px;height:34px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:15px;flex-shrink:0;transition:filter .1s}
  .composer .send:active{filter:brightness(.9)}

  /* ASISTENTE */
  .asis{display:flex;flex-direction:column;height:100%;max-width:800px;margin:0 auto;width:100%;background:var(--bg)}
  .asis-head{padding:15px 20px;border-bottom:1px solid var(--sep);background:var(--titlebar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;gap:12px}
  .asis-head .bot{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#0a84ff,#5e5ce6);display:grid;place-items:center;font-size:19px}
  .asis-head h2{margin:0;font-size:15px;font-weight:600}
  .asis-head .s{color:var(--muted);font-size:12.5px;margin-top:2px}
  .asis-msgs{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:10px}
  .msg.bot{background:var(--in);border:1px solid var(--sep)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px 0}
  .chip-s{background:var(--card);border:1px solid var(--sep-strong);border-radius:16px;padding:7px 13px;font-size:12.5px;color:var(--accent);transition:background .1s}
  .chip-s:hover{background:var(--hover)}
  .chip-s:active{transform:scale(.98)}

  /* INBOX */
  .inbox{display:grid;grid-template-columns:320px 1fr 330px;height:100%}
  .col-conv{border-right:1px solid var(--sep);display:flex;flex-direction:column;min-height:0;background:var(--sidebar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  .conv-top{padding:14px 14px 10px}
  .conv-top h2{margin:0 0 4px;font-size:18px;font-weight:700;letter-spacing:-0.01em}
  .conv-top .auto-note{font-size:11.5px;color:#34c759;font-weight:600;margin-bottom:10px}
  .conv-top input{width:100%;background:var(--hover);border:1px solid transparent;border-radius:8px;padding:7px 12px;color:var(--txt);font-size:13px}
  .conv-top input:focus{outline:none;background:var(--card);border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,122,255,.2)}
  .conv-list{overflow-y:auto;flex:1;padding:0 8px 8px}
  .conv{display:flex;gap:11px;padding:8px 10px;margin:1px 0;border-radius:8px;cursor:pointer;align-items:center;transition:background .16s ease}
  .conv:hover{background:var(--hover)}.conv.sel{background:var(--accent)}
  .conv.sel .nm,.conv.sel .pv,.conv.sel .rt{color:#fff}
  .conv.sel .pv,.conv.sel .rt{opacity:.82}
  .av{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:600;color:#fff;font-size:14px}
  .conv .mid{flex:1;min-width:0}
  .conv .nm{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
  .conv .nm .tdot{width:8px;height:8px;border-radius:50%}
  .conv .pv{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .conv .rt{font-size:11px;color:var(--muted);align-self:flex-start;white-space:nowrap}
  .col-chat{display:flex;flex-direction:column;min-height:0;background:var(--grouped)}
  .chat-head{display:flex;align-items:center;gap:11px;padding:10px 16px;border-bottom:1px solid var(--sep);background:var(--titlebar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  .chat-head .nm{font-weight:600}.chat-head .sub{font-size:12px;color:var(--muted)}
  .temp-tag{margin-left:auto;font-size:12px;font-weight:600;padding:3px 11px;border-radius:20px}
  .messages{flex:1;overflow-y:auto;padding:20px 26px;display:flex;flex-direction:column;gap:6px}
  .daysep{align-self:center;background:var(--card);color:var(--muted);font-size:11px;padding:3px 11px;border-radius:20px;margin:6px 0;border:1px solid var(--sep)}
  .hint{font-size:10.5px;color:var(--muted);text-align:center;padding:5px}
  .col-crm{border-left:1px solid var(--sep);overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg)}
  .crm-h{padding:20px 16px;border-bottom:1px solid var(--sep);text-align:center}
  .crm-h .av{margin:0 auto 10px;width:60px;height:60px;font-size:22px}
  .crm-h .nm{font-weight:700;font-size:17px;letter-spacing:-0.01em}.crm-h .wa{color:var(--muted);font-size:13px;margin-top:3px}
  .crm-b{padding:16px}
  .banner{border-radius:12px;padding:11px 13px;margin-bottom:16px;font-weight:500;font-size:13.5px;display:flex;gap:9px;align-items:flex-start;line-height:1.35}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
  .field input,.field select,.field textarea{width:100%;background:var(--card);border:1px solid var(--sep-strong);border-radius:8px;padding:8px 11px;color:var(--txt);font-size:13.5px}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,122,255,.22)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .auto{background:var(--grouped);border:1px solid var(--sep);border-radius:9px;padding:9px 11px;font-size:12.5px;color:var(--muted)}
  .auto b{color:var(--txt)}
  .section-t{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600;margin:18px 0 9px}
  .logitem{background:var(--grouped);border:1px solid var(--sep);border-radius:10px;padding:9px 11px;margin-bottom:7px}
  .logitem .lt{font-size:11px;color:var(--muted);margin-bottom:2px}.logitem .lx{font-size:13px;white-space:pre-wrap;line-height:1.4}
  .btn{background:var(--accent);color:#fff;border:none;padding:7px 14px;border-radius:8px;font-weight:500;font-size:13.5px;transition:filter .1s}
  .btn:active{filter:brightness(.92);transform:scale(.98)}
  .btn.ghost{background:var(--card);color:var(--accent);border:1px solid var(--sep-strong)}.btn.sm{padding:5px 11px;font-size:13px}
  .btn.danger{background:var(--card);color:#ff3b30;border:1px solid #ff3b3066}.btn.danger:hover{background:#ff3b3012}
  .conv-head-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:200;padding:16px;animation:viewIn .18s ease}
  .modal{background:var(--card);border:1px solid var(--sep);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.28);width:420px;max-width:100%;overflow:hidden}
  .modal-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--sep);font-size:15px}
  .modal-b{padding:14px 18px;display:flex;flex-direction:column}
  .modal-b label{font-size:12px;font-weight:600;color:var(--muted);margin:9px 0 3px}
  .modal-b input,.modal-b select,.modal-b textarea{width:100%;background:var(--bg);border:1px solid var(--sep-strong);border-radius:8px;padding:9px 12px;color:var(--txt);font-size:14px;font-family:inherit;box-sizing:border-box}
  .modal-b textarea{min-height:70px;resize:vertical}
  .modal-b input:focus,.modal-b select:focus,.modal-b textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,122,255,.2)}
  .modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--sep)}
  /* ---- Wizard Cargar venta ---- */
  .head-btns{display:flex;gap:8px;flex-wrap:wrap}
  .venta-modal{width:min(480px,calc(100vw - 32px));display:flex;flex-direction:column;max-height:92vh}
  .venta-modal .modal-b{overflow-y:auto}
  .venta-steps{display:flex;align-items:center;gap:6px;padding:12px 18px;border-bottom:1px solid var(--sep)}
  .vstep{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;font-weight:600}
  .vstep .vnum{width:22px;height:22px;border-radius:50%;background:var(--sep);color:var(--muted);display:grid;place-items:center;font-size:12px;flex:none}
  .vstep.on .vnum{background:var(--accent);color:#fff}
  .vstep.on{color:var(--txt)}
  .vstep.done .vnum{background:#34c759;color:#fff}
  .vsep{flex:1;height:1px;background:var(--sep)}
  .scan-box{background:var(--bg);border:1px dashed var(--sep-strong);border-radius:12px;padding:12px;margin-bottom:6px}
  .scan-title{font-size:12.5px;font-weight:700;color:var(--txt);margin-bottom:9px}
  .scan-title span{font-weight:500;color:var(--muted)}
  .scan-imgs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:9px}
  .scan-slot{position:relative;aspect-ratio:1.6;border:1px solid var(--sep-strong);border-radius:9px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;color:var(--muted)}
  .scan-slot:hover{border-color:var(--accent)}
  .scan-slot .scan-plus{font-size:22px;line-height:1}
  .scan-slot .scan-cap{font-size:11.5px;font-weight:600;margin-top:2px}
  .scan-slot.has{cursor:default;border-style:solid}
  .scan-slot.has img{width:100%;height:100%;object-fit:cover}
  .scan-x{position:absolute;top:4px;right:4px;width:22px;height:22px;border:none;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:12px;line-height:1;display:grid;place-items:center}
  .scan-btn{width:100%;font-size:13px}
  .scan-btn:disabled{opacity:.5;cursor:default}
  .scan-msg{font-size:12px;margin-top:7px;text-align:center;min-height:0}
  .scan-msg.ok{color:#248a3d}
  .scan-msg.err{color:#c0392b}
  .seg2{display:flex;gap:0;border:1px solid var(--sep-strong);border-radius:9px;overflow:hidden;margin-bottom:12px}
  .seg2 button{flex:1;border:none;background:var(--card);color:var(--muted);padding:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .seg2 button.on{background:var(--accent);color:#fff}
  .v-hint{background:var(--bg);border-radius:10px;padding:14px;font-size:13px;color:var(--muted);line-height:1.5}
  .v-sec-t{font-size:13px;font-weight:700;color:var(--txt);margin-bottom:8px}
  .v-sec-t span{font-weight:500;color:var(--muted);font-size:12px}
  .v-rows{display:flex;flex-direction:column;gap:9px}
  .v-card{background:var(--bg);border:1px solid var(--sep);border-radius:10px;padding:9px;display:flex;flex-direction:column;gap:7px}
  .v-full{width:100%}
  .v-lbl-sm{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:2px}
  .v-selbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg);border:1px solid var(--sep-strong);border-radius:8px;padding:9px 12px;color:var(--txt);font-size:14px;font-family:inherit;cursor:pointer;text-align:left;box-sizing:border-box;line-height:1.3}
  .v-selbtn:hover{border-color:var(--accent)}
  .v-selbtn.ph{color:var(--muted)}
  .v-selarr{color:var(--muted);font-size:10px;flex:none}
  .v-prow>.v-selbtn{flex:1;min-width:0}
  .pick-back{z-index:400}
  .pick-modal{width:min(360px,calc(100vw - 32px));max-height:80vh;display:flex;flex-direction:column}
  .pick-list{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:2px}

function fmtTel(v){
  v=v||'';
  // Autoformato lindo de EE.UU. SOLO si arranca con "+1" y hay dígitos después.
  // Si el usuario borra el +1 o pone otro código de país, se deja escribir libre.
  if(v.indexOf('+1')===0){
    const d=v.slice(2).replace(/\D/g,'').slice(0,10);
    if(!d.length)return v.replace(/[^\d+()\-\s]/g,''); // "+1"/"+1 " → tal cual (permite seguir borrando)
    // El ")" se agrega SOLO con 4+ dígitos, así el backspace borra de corrido (no se re-agrega el ")").
    let s='+1 ('+d.slice(0,Math.min(3,d.length));
    if(d.length>3)s+=') '+d.slice(3,Math.min(6,d.length));
    if(d.length>6)s+='-'+d.slice(6,10);
    return s;
  }
  return v.replace(/[^\d+()\-\s]/g,''); // otro número / código de país: libre
}

//  - Admin → SOLO sus propios clientes (los ajenos se ven únicamente entrando por Equipo).
//  - Vendedor → los suyos (el server ya manda solo esos). Supervisor/Dueño → todo (vista de equipo).
function misTodos(){
  if(filtroVend)return clientes.filter(c=>c.vendedorId===filtroVend&&!c.descartado);
  if(me&&me.rol==='admin')return clientes.filter(c=>c.vendedorId===me.id&&!c.descartado);
  return clientes.filter(c=>!c.descartado);
}
function activos(){return misTodos().filter(c=>!c.borrado);}
function ordenados(){return activos().slice().sort((a,b)=>(b.ultimoContacto||'').localeCompare(a.ultimoContacto||''));}

  const cc=document.getElementById('cnt-cal');if(cc)cc.textContent=A.filter(c=>{const t=temperatura(c);return t&&t.id==='caliente';}).length;
  const ca=document.getElementById('cnt-agenda');if(ca)ca.textContent=A.filter(c=>c.proximo).length;

  else if(view==='hoy')renderAgendaSec('hoy');
  else if(view==='proximos')renderAgendaSec('proximos');

  }

}
function enviarAsis(texto){
  texto=texto.trim();if(!texto)return;
  asistente.push({de:'yo',texto});
  const reply=procesar(texto);
  asistente.push({de:'bot',texto:reply});
  saveA();save();renderAsis();
}
function findClient(text){
  const low=text.toLowerCase();
  for(const c of clientes){const full=c.nombre.replace(/\(.*\)/,'').trim().toLowerCase();if(full&&low.includes(full))return c;}
  for(const c of clientes){const first=c.nombre.replace(/\(.*\)/,'').trim().toLowerCase().split(' ')[0];if(first&&new RegExp('\\b'+first+'\\b').test(low))return c;}
  return null;
}
function detProducto(t){t=t.toLowerCase();if(/kit|solar|panel/.test(t))return 'Kit solar';if(/tricicl/.test(t))return 'Triciclo';if(/moto/.test(t))return 'Moto';return null;}
function detEtapa(t){t=t.toLowerCase();if(/vend[ií]|vendid|pag[oó]|compr[oó]|cerr[eé]|cerrado/.test(t))return 'vendido';if(/negoci|regate|oferta/.test(t))return 'negociando';if(/interes|pregunt|consult|quiere|averigu/.test(t))return 'interesado';return null;}
function detFecha(t){t=t.toLowerCase();if(/pasado\s+mañana/.test(t))return daysAhead(2);if(/\bmañana\b/.test(t))return daysAhead(1);if(/\bhoy\b/.test(t))return hoy();if(/semana que viene|pr[oó]xima semana|la otra semana/.test(t))return daysAhead(7);const m=t.match(/en\s+(\d+)\s+d[ií]as/);if(m)return daysAhead(+m[1]);const dd=['domingo','lunes','martes','mi[eé]rcoles','jueves','viernes','s[aá]bado'];for(let i=0;i<7;i++)if(new RegExp('\\b'+dd[i]).test(t))return nextWeekday(i);return '';}
function nuevoNombre(t){const m=t.match(/(?:cargá|carga|agregá|agrega|nuevo cliente|nuevo lead|anotá a|anota a|sumá a|suma a)\s+([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+(?:\s+[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)?)/);return m?m[1].trim():null;}
function procesar(text){
  const acc=[];let c=findClient(text);
  const crearKW=/(cargá|carga|agregá|agrega|nuevo cliente|nuevo lead|anotá a|anota a|sumá a|suma a)/i.test(text);
  if(!c&&crearKW){const nom=nuevoNombre(text);if(nom){c={id:uid(),nombre:nom,whatsapp:'',producto:detProducto(text)||'Moto',ubicacion:'',etapa:'nuevo',valor:0,proximo:hoy(),proximoTipo:'Seguimiento',creado:hoy(),ultimoContacto:hoy(),respondioUltimo:'cliente',log:[],mensajes:[]};clientes.push(c);acc.push('creé el cliente <b>'+esc(nom)+'</b>');}}
  if(!c)return 'No identifiqué de qué cliente hablás. Probá con el nombre — ej: <i>"Yosvani quiere la moto roja"</i>. Para uno nuevo: <i>"Cargá a Juan, preguntó por un triciclo"</i>.';
  const p=detProducto(text);if(p&&p!==c.producto){c.producto=p;acc.push('producto → <b>'+p+'</b>');}
  const e=detEtapa(text);if(e&&e!==c.etapa){c.etapa=e;acc.push('etapa → <b>'+etapaDe(e).nombre+'</b>');}
  const f=detFecha(text);if(f){c.proximo=f;acc.push('seguimiento → <b>'+f+'</b>');}
  c.log=c.log||[];c.log.push({fecha:hoy(),texto});acc.push('anoté la nota en su ficha');
  save();
  return '✅ Listo, en <b>'+esc(c.nombre)+'</b>: '+acc.join(', ')+'.<br><span style="color:#71798a;font-size:12.5px">Miralo en Clientes o Seguimiento.</span>';
}

function lastLogText(c){const l=(c.log||[]);return l.length?l[l.length-1].texto:'';}
function convPreview(c){
  const last=c.mensajes&&c.mensajes.length?c.mensajes[c.mensajes.length-1]:null;
  if(last)return (last.de==='yo'?'Vos: ':'')+last.texto;
  const lg=lastLogText(c);
  return lg||'Sin mensajes todavía';
}
function convWhen(c){
  const last=c.mensajes&&c.mensajes.length?c.mensajes[c.mensajes.length-1]:null;
  return relTime((last&&last.fecha)||c.ultimoContacto||c.creado);
}
function needsReply(c){return c.respondioUltimo==='cliente'&&c.etapa!=='vendido'&&c.etapa!=='posventa';}
// Lista de clientes de una sección (para mostrarla como columna del medio al abrir un contacto desde ahí).
function ctxList(ctx){const A=activos();
  const byNuevo=(a,b)=>creaKey(b)-creaKey(a);                    // más nuevo (agregado) arriba
  const byProxAsc=(a,b)=>proxDateTime(a)-proxDateTime(b);         // fecha más temprana/atrasada arriba
  const byProxDesc=(a,b)=>proxDateTime(b)-proxDateTime(a);        // fecha más nueva arriba
  const byVenta=(a,b)=>String(b.vendidoFecha||'').localeCompare(String(a.vendidoFecha||'')); // venta más nueva arriba
  if(ctx==='calientes')return A.filter(c=>{const t=temperatura(c);return t&&t.id==='caliente';}).sort(byNuevo);
  if(ctx==='frios')return A.filter(c=>{const t=temperatura(c);return t&&(t.id==='sinContacto'||t.id==='frio');}).sort(byNuevo);
  if(ctx==='seg')return A.filter(c=>temperatura(c)).sort(byNuevo);
  if(ctx==='anotar')return A.filter(sinAnotar).sort(byNuevo);
  if(ctx==='vendidos')return A.filter(c=>c.etapa==='vendido'||c.etapa==='posventa').sort(byVenta);
  if(ctx==='atrasado')return A.filter(c=>enBucket(c,'atrasado')).sort(byProxAsc);
  if(['hoy','proximos','semana'].includes(ctx))return A.filter(c=>enBucket(c,ctx)).sort(byProxDesc);
  return null;
}

// Ganancias: mes (se reinicia el 1° de cada mes) o total (histórico). Switch en la tarjeta del panel.
let earnMode='mes';
function computeEarn(){const AA=activos();const mesAct=hoy().slice(0,7);const vend=AA.filter(c=>c.etapa==='vendido'||c.etapa==='posventa');const vm=vend.filter(c=>(c.vendidoFecha||'').slice(0,7)===mesAct);const g=a=>a.reduce((s,c)=>s+(Number(c.comision)||0),0);const q=a=>a.reduce((s,c)=>s+(Number(c.cantidad)||1),0);return {mes:{g:g(vm),n:q(vm)},total:{g:g(vend),n:q(vend)}};}
function _earnMoney(v){return '$'+Number(v||0).toLocaleString('es-AR');}
function earnCardHTML(){return `<div class="ec-top"><div class="ec-label" id="ec-label"></div><div class="ec-switch ${earnMode==='total'?'is-total':''}"><span class="ec-thumb"></span><span class="ec-tab ${earnMode==='mes'?'on':''}">Este mes</span><span class="ec-tab ${earnMode==='total'?'on':''}">Total</span></div></div><div class="ec-amount" id="ec-amount"></div><div class="ec-sub" id="ec-sub"></div>`;}
// Actualiza los textos + desliza el thumb SIN redibujar la tarjeta (para que la transición se vea).
function earnApply(){const e=computeEarn(),cur=earnMode==='total'?e.total:e.mes;
  const lab=document.getElementById('ec-label'),amt=document.getElementById('ec-amount'),sub=document.getElementById('ec-sub'),sw=document.querySelector('.ec-switch');
  if(lab)lab.textContent=earnMode==='total'?'💰 Ganado en total':'💰 Ganado este mes';
  if(amt)amt.textContent=_earnMoney(cur.g);
  if(sub)sub.textContent=earnMode==='total'?(cur.n+' venta(s) en total · comisiones acumuladas'):(cur.n+' venta(s) cerradas este mes');
  if(sw){sw.classList.toggle('is-total',earnMode==='total');sw.querySelectorAll('.ec-tab').forEach((t,i)=>t.classList.toggle('on',(i===0)===(earnMode==='mes')));}
}

function setProximo(id,silent){
  const c=clientes.find(x=>x.id===id);if(!c)return;
  const fe=document.getElementById('prox-fecha'),he=document.getElementById('prox-hora'),te=document.getElementById('prox-tipo');
  const f=fe?fe.value:'',h=he?he.value:'',tp=te?te.value:'Llamada';
  if(!f){if(!silent)alert('Elegí una fecha para el contacto.');return;}
  c.proximo=f;c.proximoHora=h||'';c.proximoTipo=tp;
  c.log=c.log||[];
  const txt='📅 Agendado: '+tp+' para el '+f+(h?' '+h:'');
  const last=c.log[c.log.length-1];
  if(last&&last.fecha===hoy()&&/^📅 Agendado:/.test(last.texto))last.texto=txt; // no repetir la nota si ya agendó hoy
  else c.log.push({fecha:hoy(),hora:ahora(),texto:txt});
  save();
  // Auto (mientras escribís): guardar y actualizar contadores SIN redibujar el
  // casillero, para no interrumpir el tipeo. El botón sí redibuja la ficha.
  if(silent)updateCounts();else renderInboxKeepScroll();
}

function googleCal(id){
  const c=clientes.find(x=>x.id===id);if(!c)return;
  const gv=k=>{const el=document.getElementById(k);return el?el.value:'';};
  const f=gv('prox-fecha')||c.proximo, h=gv('prox-hora')||c.proximoHora||'', tp=gv('prox-tipo')||c.proximoTipo||'Seguimiento';
  if(!f){alert('Primero elegí una fecha para el contacto.');return;}
  setProximo(id,false); // agenda también en el CRM (como "Agendar contacto")
  const pad=n=>String(n).padStart(2,'0');
  let dates;
  if(h&&/^\d{1,2}:\d{2}/.test(h)){
    const p=h.split(':'),start=new Date(f+'T'+pad(+p[0])+':'+pad(+p[1])+':00'),end=new Date(start.getTime()+30*60000);
    const fmt=d=>''+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
    dates=fmt(start)+'/'+fmt(end);
  } else {
    const nd=new Date(f+'T00:00:00');nd.setDate(nd.getDate()+1);
    dates=f.replace(/-/g,'')+'/'+(''+nd.getFullYear()+pad(nd.getMonth()+1)+pad(nd.getDate()));
  }
  const title=tp+' - '+c.nombre;
  const det=['Cliente: '+c.nombre,c.whatsapp?('WhatsApp: '+c.whatsapp):'',c.producto?('Producto: '+c.producto):'',c.operacion?('Operación: '+c.operacion):''].filter(Boolean).join('\n');
  const url='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+dates+'&details='+encodeURIComponent(det);
  window.open(url,'_blank','noopener');
}

function gruposHTML(){
  const q=(filtro||'').toLowerCase();
  const base=activos().filter(c=>!q||(c.nombre+' '+c.whatsapp+' '+c.producto).toLowerCase().includes(q));
  if(!base.length)return '<div class="empty" style="padding:16px">Sin resultados'+(q?' para "'+esc(filtro)+'"':'')+'</div>';
  const byVend={};base.forEach(c=>{const k=c.vendedorId||'—';(byVend[k]=byVend[k]||[]).push(c);});
  const ids=Object.keys(byVend).sort((a,b)=>byVend[b].length-byVend[a].length);
  let h='';
  for(const vid of ids){
    const cs=byVend[vid].sort((a,b)=>(esCalienteT(b)?1:0)-(esCalienteT(a)?1:0));

function _fileToScaled(file){return new Promise((resolve,reject)=>{
  const fr=new FileReader();fr.onerror=()=>reject();
  fr.onload=()=>{const img=new Image();img.onerror=()=>reject();
    img.onload=()=>{const max=1100;let w=img.width,h=img.height;
      if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
      resolve({mime:'image/jpeg',data:cv.toDataURL('image/jpeg',0.82).split(',')[1]});};
    img.src=fr.result;};
  fr.readAsDataURL(file);});}

// Calcula lo que paga el cliente: por cada pago, base + (7% tax si la financiera lo lleva) + fee de la financiera
function _ventaCalc(){
  let base=0,tax=0,fee=0;const lineas=[];
  _venta.pagos.forEach(p=>{
    const m=parseFloat(p.monto)||0;let t=0,f=0,fin=null;
    if(p.metodo==='financiado'){
      if(p.financiera&&_FINBY[p.financiera]){fin=_FINBY[p.financiera];t=fin.tax?m*0.07:0;f=m*fin.fee;}
    }else if(p.metodo==='zelle'||p.metodo==='debito'||p.metodo==='credito'){
      t=m*0.07; // tarjeta/zelle: 7% de taxes (el cash no lleva)
    }
    base+=m;tax+=t;fee+=f;lineas.push({p,m,t,f,fin,total:m+t+f});
  });
  return {base,tax,fee,total:base+tax+fee,lineas};
}
function _ventaCalcHTML(){
  const c=_ventaCalc();
  let h='<div class="v-calc-t">Total a cobrar al cliente</div>';
  c.lineas.forEach(L=>{
    if(!L.m)return;
    const label=_VMETLBL[L.p.metodo]||L.p.metodo;
    const fin=(L.p.metodo==='financiado'&&L.p.financiera)?' · '+L.p.financiera:'';
    const extra=[];if(L.t)extra.push('+7% tax');if(L.f)extra.push('+'+_pctLabel(L.fin.fee)+' fee');
    h+='<div class="v-calc-ln"><span>'+esc(label+fin)+' · $'+_money(L.m)+(extra.length?' <span class="v-calc-x">('+extra.join(' ')+')</span>':'')+'</span><b>$'+_money(L.total)+'</b></div>';
  });
  h+='<div class="v-calc-tot"><span>Total a cobrar</span><b>$'+_money(c.total)+'</b></div>';
  if(_venta.pagos.some(p=>p.metodo==='financiado'&&!p.financiera))h+='<div class="v-calc-note">⚠️ Elegí la financiera para calcular su fee.</div>';
  return h;
}

async function _subirDocs(imgs){
  const out=[];
  for(const im of (imgs||[])){
    if(im&&im.data){
      try{const r=await api('/api/venta-doc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:im.data,mime:im.mime})});const j=await r.json();if(j&&j.id)out.push(j.id);}catch(e){}
    }
  }
  return out;
}

// Cache de imágenes de documentos (blob) — se cargan con la sesión, no van dentro de clientes.json
const _docBlobs={};
function hydrateVentaDocs(){
  document.querySelectorAll('img.vr-doc[data-doc]').forEach(img=>{
    if(img.dataset.loaded)return;
    const id=img.getAttribute('data-doc');
    img.dataset.loaded='1';
    if(_docBlobs[id]){img.src=_docBlobs[id];return;}
    api('/api/vdoc?id='+encodeURIComponent(id)).then(r=>r.ok?r.blob():null).then(b=>{
      if(!b)return;const url=URL.createObjectURL(b);_docBlobs[id]=url;
      const el=document.querySelector('img.vr-doc[data-doc="'+id+'"]');if(el)el.src=url;
    }).catch(()=>{});
  });
}
function verDoc(id){
  const src=_docBlobs[id];if(!src)return;
  const ov=document.createElement('div');ov.className='doc-lb';ov.onclick=()=>ov.remove();
  ov.innerHTML='<img src="'+src+'"><button class="doc-lb-x">✕</button>';
  document.body.appendChild(ov);

function renderPapelera(){
  const esAdmin=!!(me&&me.rol==='admin');
  const ord=(a,b)=>String((b.descartadoFecha||b.borradoFecha)||'').localeCompare(String((a.descartadoFecha||a.borradoFecha)||''));
  const fila=(c,eq)=>{
    const meta=[esc(c.producto||'')+(c.whatsapp?' · '+esc(c.whatsapp):'')];
    if(eq)meta.push('cartera de '+esc(nombreVend(c.vendedorId)));
    if(c.descartado)meta.push('<span style="color:#ff3b30">❌ descartado por '+esc(c.descartadoPor||nombreVend(c.vendedorId))+(c.descartadoFecha?' el '+fmtFecha(c.descartadoFecha):'')+'</span>');
    else if(c.borradoFecha)meta.push('borrado el '+fmtFecha(c.borradoFecha));
    const btnDel=esAdmin?`<button class="btn sm danger" onclick="eliminarDefinitivo('${c.id}')">Eliminar</button>`:`<button class="btn sm danger" onclick="eliminarDefinitivo('${c.id}')">Descartar</button>`;
    const motivoHtml=c.borradoMotivo?`<div style="font-size:12px;color:var(--txt);margin-top:2px">📝 <i>${esc(c.borradoMotivo)}</i></div>`:'';
    return `<div class="frow"><div class="av" style="width:34px;height:34px;background:${avColor(c.id)};font-size:12px">${iniciales(c.nombre)}</div><div style="flex:1;min-width:0"><b>${esc(c.nombre)}</b><div style="font-size:12px;color:var(--muted)">${meta.filter(Boolean).join(' · ')}</div>${motivoHtml}</div><button class="btn sm ghost" onclick="restaurarCliente('${c.id}')">↩ Restaurar</button>${btnDel}</div>`;
  };
  let h=`<div class="page"><h1>🗑️ Papelera</h1>`;
  if(esAdmin){
    const mias=clientes.filter(c=>c.borrado&&!c.descartado&&c.vendedorId===me.id).sort(ord);
    const equipo=clientes.filter(c=>c.vendedorId!==me.id&&(c.borrado||c.descartado)).sort(ord);
    h+=`<div class="sub">Tu papelera y la de tu equipo. Lo que un vendedor descarta queda archivado acá.</div>`;
    h+=`<div class="panelcard"><h3>🗑️ Mi papelera <span class="muted" style="font-weight:500">· ${mias.length}</span></h3>${mias.length?mias.map(c=>fila(c,false)).join(''):'<div class="empty">Vacía.</div>'}</div>`;
    h+=`<div class="panelcard"><h3>👥 Papelera del equipo <span class="muted" style="font-weight:500">· ${equipo.length}</span></h3>${equipo.length?equipo.map(c=>fila(c,true)).join(''):'<div class="empty">Nada del equipo por ahora.</div>'}</div>`;
  }else{
    const mias=misTodos().filter(c=>c.borrado&&!c.descartado).sort(ord);
    h+=`<div class="sub">${mias.length} cliente(s) en tu papelera. Restauralos o descartalos.</div><div class="panelcard">${mias.length?mias.map(c=>fila(c,false)).join(''):'<div class="empty">La papelera está vacía.</div>'}</div>`;
  }
  main.innerHTML=h+'</div>';
}

/* ---- ESTADO DE AGENDA (atrasado/hoy/próximos/semana) con 15 min de tolerancia ---- */
function proxDateTime(c){if(!c.proximo)return null;const h=(c.proximoHora&&/^\d{1,2}:\d{2}/.test(c.proximoHora))?c.proximoHora:'23:59';return new Date(c.proximo+'T'+(h.length===4?'0'+h:h)+':00');}
// Los cajones NO son excluyentes: un cliente de hoy con la hora ya pasada
// está en Atrasados Y en Hoy a la vez.
function esAtrasado(c){const dt=proxDateTime(c);return !!dt&&!isNaN(dt)&&dt.getTime()<Date.now()-15*60000;}
function esHoy(c){return !!c.proximo&&c.proximo===hoy();}
function diasA(c){if(!c.proximo)return null;return Math.round((new Date(c.proximo+'T00:00:00')-new Date(hoy()+'T00:00:00'))/86400000);}
function enBucket(c,b){
  if(!c.proximo)return false;
  // Un cliente vendido/posventa sale de las carpetas de agenda, salvo que tenga la etiqueta "seguimiento"
  if((c.etapa==='vendido'||c.etapa==='posventa')&&!(c.tags&&c.tags.includes('seguimiento')))return false;
  if(b==='atrasado')return esAtrasado(c);
  if(b==='hoy')return esHoy(c);
  if(b==='proximos'){const d=diasA(c);return d>=1&&d<=6;}
  if(b==='semana'){const d=diasA(c);return d>=7;}
  return false;
}
// bucket "principal" (para donde se necesite uno solo)
function estadoAgenda(c){
  if(!c.proximo)return null;
  if(esAtrasado(c))return 'atrasado';
  if(esHoy(c))return 'hoy';
  const d=diasA(c);return (d>=1&&d<=6)?'proximos':'semana';
}

/* ---- Historial: el botón atrás del navegador y el gesto de deslizar vuelven al paso anterior ---- */
let _navlock=false;

function pushHistory(){if(_navlock)return;const st=snapState();if(_sameState(history.state,st))return;try{history.pushState(st,'');}catch(e){}}
function restoreState(st){_navlock=true;try{if(st&&st.v){view=st.v;selectedId=st.s;inboxCtx=st.c||null;filtroEtapa=st.fe||'';filtroVend=st.fv||'';filtro=st.f||'';document.body.classList.toggle('chat-open',!!st.co);render();}else{document.body.classList.remove('chat-open');}}catch(e){}finally{_navlock=false;}}

function emojify(root){
  if(!root)return;
  const skip={SCRIPT:1,STYLE:1,TEXTAREA:1,INPUT:1,OPTION:1,SELECT:1,IMG:1,SVG:1};
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    if(!n.nodeValue||!EMOJI_TEST.test(n.nodeValue))return NodeFilter.FILTER_REJECT;
    const p=n.parentNode;if(!p||skip[p.nodeName])return NodeFilter.FILTER_REJECT;
    if(p.classList&&p.classList.contains('emoji'))return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  const nodes=[];let n;while(n=walker.nextNode())nodes.push(n);
  for(const node of nodes){
    const val=node.nodeValue;const html=esc(val).replace(EMOJI_RE,m=>emojiImg(m));
    if(html!==val){const span=document.createElement('span');span.innerHTML=html;const kids=[...span.childNodes];node.replaceWith(...kids);}
  }
}
let _emojiMo=null;
function initEmoji(){
  try{emojify(document.body);}catch(e){}
  _emojiMo=new MutationObserver(()=>{_emojiMo.disconnect();try{emojify(document.body);}catch(e){}finally{_emojiMo.observe(document.body,{childList:true,subtree:true});}});
  _emojiMo.observe(document.body,{childList:true,subtree:true});
}
initEmoji();
(function(){
  const inFS=()=>document.fullscreenElement;
  const g=document.getElementById('tl-green'),r=document.getElementById('tl-red'),y=document.getElementById('tl-yellow');
  if(g)g.onclick=()=>{inFS()?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});};
  if(r)r.onclick=()=>{if(inFS())document.exitFullscreen();};
  if(y)y.onclick=()=>document.body.classList.toggle('side-collapsed');
})();
(function(){
  function applyTheme(){const dark=localStorage.getItem('crmTheme')==='dark';document.body.classList.toggle('dark',dark);const b=document.getElementById('theme-toggle');if(b)b.textContent=dark?'☀️':'🌙';}
  const tb=document.getElementById('theme-toggle');if(tb)tb.onclick=()=>{
    const d=localStorage.getItem('crmTheme')!=='dark';
    const apply=()=>{localStorage.setItem('crmTheme',d?'dark':'light');applyTheme();};
    // Crossfade de TODA la pantalla de una (evita el cambio disparejo/parte blanca). Respaldo: transición por CSS.
    if(document.startViewTransition){document.startViewTransition(apply);}
    else{document.body.classList.add('theme-anim');apply();clearTimeout(window._themeT);window._themeT=setTimeout(()=>document.body.classList.remove('theme-anim'),650);}
  };
  applyTheme();
})();
/* ---- Auth / arranque ---- */
function roleLabel(r){return {admin:'Admin',dueno:'Dueño',supervisor:'Supervisor',vendedor:'Vendedor'}[r]||'';}
function renderAcct(){const acct=document.querySelector('.side-foot .acct');if(acct&&me)acct.innerHTML='<button class="perfil-btn" onclick="abrirPerfil()" title="Mi perfil"><span class="a">'+esc((me.nombre||'?').slice(0,1).toUpperCase())+'</span><span class="pf-info"><span class="pf-nm">'+esc(me.nombre||'')+'</span><span class="pf-rol">'+roleLabel(me.rol)+(RO()?' · solo lectura':'')+'</span></span><span class="pf-cog">⚙︎</span></button>';}
function abrirPerfil(){
  cerrarModal();const m=me||{};
  const wrap=document.createElement('div');wrap.className='modal-back';wrap.id='modal-nuevo';
  wrap.innerHTML=`<div class="modal"><div class="modal-h"><b>👤 Mi perfil</b><button class="mini" onclick="cerrarModal()">✕</button></div><div class="modal-b"><div class="row2"><div class="field"><label>Nombre</label><input id="pf-nombre" value="${esc(m.nombre||'')}"></div><div class="field"><label>Apellido</label><input id="pf-apellido" value="${esc(m.apellido||'')}"></div></div><div class="row2"><div class="field"><label>Teléfono</label><input id="pf-tel" inputmode="tel" value="${esc(m.telefono||'')}"></div><div class="field"><label>Email</label><input id="pf-email" inputmode="email" value="${esc(m.email||'')}"></div></div><div class="field"><label>Usuario (para entrar)</label><input id="pf-user" autocomplete="off" value="${esc(m.usuario||'')}"></div><div class="section-t" style="margin-top:8px">🔑 Cambiar contraseña (opcional)</div><div class="row2"><div class="field"><label>Nueva clave</label><input id="pf-p1" type="password" autocomplete="new-password" placeholder="vacío = no cambiar"></div><div class="field"><label>Repetir</label><input id="pf-p2" type="password" autocomplete="new-password"></div></div><div id="pf-err" class="lg-err"></div></div><div class="modal-f"><button class="btn ghost" style="color:#ff3b30;border-color:#ff3b3055;margin-right:auto" onclick="logout()">Cerrar sesión</button><button class="btn ghost" onclick="cerrarModal()">Cancelar</button><button class="btn" onclick="guardarPerfil()">Guardar</button></div></div>`;
  wrap.onclick=e=>{if(e.target===wrap)cerrarModal();};document.body.appendChild(wrap);
}
async function guardarPerfil(){
  const g=k=>{const el=document.getElementById(k);return el?el.value:'';};
  const err=document.getElementById('pf-err');err.textContent='';
  const body={nombre:g('pf-nombre').trim(),apellido:g('pf-apellido').trim(),telefono:g('pf-tel').trim(),email:g('pf-email').trim(),usuario:g('pf-user').trim()};
  if(!body.nombre){err.textContent='Poné al menos un nombre.';return;}
  const p1=g('pf-p1').trim(),p2=g('pf-p2').trim();
  if(p1||p2){if(p1.length<4){err.textContent='La clave nueva necesita al menos 4 caracteres.';return;}if(p1!==p2){err.textContent='Las dos claves no coinciden.';return;}body.pass=p1;}
  try{const r=await api('/api/users/'+me.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok){err.textContent=j.error||'No se pudo guardar';return;}me=j;renderAcct();cerrarModal();alert('✅ Perfil actualizado.');}
  catch(e){err.textContent='Error de conexión';}
}
function urlB64ToUint8(b64){const pad='='.repeat((4-b64.length%4)%4);const s=(b64+pad).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(s);const arr=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);return arr;}
function esStandalone(){return window.navigator.standalone===true||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);}
// Mantiene el push activo solo: si ya diste permiso una vez, en cada apertura re-registra la
// suscripción en silencio (aunque el navegador la haya rotado o el server la haya perdido).
async function ensurePushSubscribed(){
  try{
    if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window))return;
    if(Notification.permission!=='granted')return;
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){const pk=await (await api('/api/push/pubkey')).json();if(!pk.enabled||!pk.key)return;sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8(pk.key)});}
    await api('/api/push/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription:sub})});
    if(me)me.pushOn=true;
  }catch(e){}
}
async function activarPush(){
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(isIOS&&!esStandalone()){alert('📲 En iPhone las notificaciones solo funcionan con la app instalada.\n\n1) Tocá el botón Compartir de Safari.\n2) "Agregar a pantalla de inicio".\n3) Abrí la app DESDE ESE ÍCONO (no desde Safari) y volvé a tocar Activar.');return;}
  if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window)){alert('Este navegador no soporta notificaciones. En iPhone: agregá la app a la pantalla de inicio y abrila desde ahí.');return;}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){alert('No diste permiso para las notificaciones.');return;}
    const reg=await navigator.serviceWorker.ready;
    const pk=await (await api('/api/push/pubkey')).json();
    if(!pk.enabled||!pk.key){alert('Las notificaciones del servidor todavía no están listas. Probá en un minuto.');return;}
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8(pk.key)});
    const r=await api('/api/push/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription:sub})});
    if(r.ok){if(me)me.pushOn=true;cerrarModal();alert('✅ Notificaciones activadas en este teléfono. Vas a recibir los recordatorios de tus contactos.');}
    else alert('No se pudo activar. Probá de nuevo.');
  }catch(e){alert('No se pudo activar: '+((e&&e.message)||e));}
}
async function probarPush(){
  try{const r=await (await api('/api/push/test',{method:'POST'})).json();
    if(r.ok)alert('✅ Te mandé una notificación de prueba a este dispositivo. Debería aparecer en unos segundos.');
    else if(r.reason)alert('⚠️ '+r.reason);
    else if(r.errores&&r.errores.length)alert('⚠️ No se pudo enviar. Error: '+(r.errores[0].code||'')+' '+(r.errores[0].msg||''));
    else alert('⚠️ No se pudo enviar la prueba.');
  }catch(e){alert('Error: '+((e&&e.message)||e));}
}
function conectarTelegram(){
  cerrarModal();
  const on=!!(me&&me.pushOn);
  const wrap=document.createElement('div');wrap.className='modal-back';wrap.id='modal-nuevo';
  wrap.innerHTML=`<div class="modal"><div class="modal-h"><b>🔔 Notificaciones</b><button class="mini" onclick="cerrarModal()">✕</button></div><div class="modal-b">${on?'<div style="background:#34c7591a;color:#248a3d;padding:10px 12px;border-radius:10px;font-weight:600;margin-bottom:10px">✅ Activadas en algún dispositivo.</div>':''}<div class="faint" style="font-size:13px;line-height:1.5;margin-bottom:12px">Recibí un aviso en el teléfono (como un WhatsApp) cuando llega la hora de una llamada o seguimiento de <b>tus</b> clientes, aunque tengas la app cerrada.</div><div style="display:flex;gap:8px"><button class="btn" style="flex:1;justify-content:center" onclick="activarPush()">Activar en este teléfono</button><button class="btn ghost" onclick="probarPush()">Probar</button></div><div class="faint" style="font-size:11.5px;margin-top:8px">En iPhone: primero agregá la app a la pantalla de inicio y abrila desde ese ícono. Hay que activarlo en cada teléfono.</div></div><div class="modal-f"><button class="btn" onclick="cerrarModal()">Listo</button></div></div>`;
  wrap.onclick=e=>{if(e.target===wrap)cerrarModal();};document.body.appendChild(wrap);
}
function applyRoleUI(){
  const r=me&&me.rol, owner=r==='dueno', sup=r==='supervisor', adm=r==='admin';
  const team=adm||owner||sup; // roles con herramientas de equipo (Panel + Equipo)
  document.body.classList.toggle('readonly',RO()); // supervisor/dueño = solo lectura de clientes
  document.querySelectorAll('.sv-only').forEach(el=>{el.style.display=(adm||sup)?'':'none';});   // Cuentas: admin y supervisor
  document.querySelectorAll('.admin-only').forEach(el=>{el.style.display=team?'':'none';});        // Equipo: admin, dueño y supervisor
  document.querySelectorAll('.owner-only').forEach(el=>{el.style.display=team?'':'none';});         // Panel del equipo: admin, dueño y supervisor
  // Menú por rol. Supervisión (dueño/supervisor) = menú acotado a herramientas de equipo, sin las
  // secciones de tarea diaria de vendedor (Hoy/Calientes/Atrasados/etc.) que aparecían como listas sueltas.
  const nav=document.querySelectorAll('#nav button');
  if(owner){const allow=new Set(['dueno','equipo']);nav.forEach(b=>b.style.display=allow.has(b.dataset.view)?'':'none');}
  else if(sup){const allow=new Set(['dueno','list','equipo','cuentas']);nav.forEach(b=>b.style.display=allow.has(b.dataset.view)?'':'none');}
  else{nav.forEach(b=>{if(!b.classList.contains('owner-only')&&!b.classList.contains('sv-only')&&!b.classList.contains('admin-only'))b.style.display='';});}
  const av=document.getElementById('nav-avisos');if(av)av.style.display=''; // "Avisos por Telegram" siempre visible, para todos los roles
}
function startApp(){
  const w=document.querySelector('.window');if(w)w.style.display='';
  const ov=document.getElementById('login-ov');if(ov)ov.style.display='none';
  const acct=document.querySelector('.side-foot .acct');
  renderAcct();
  if(me&&(me.rol==='dueno'||me.rol==='supervisor'))view='dueno'; // dueño y supervisor entran al Panel del equipo, no al Inicio personal
  applyRoleUI();
  try{history.replaceState(snapState(),'');}catch(e){} // estado base para el botón atrás
  if(SERVER){api('/api/users').then(r=>r.json()).then(us=>{usuarios=us;render();}).catch(()=>{});}
  loadData();
  ensurePushSubscribed(); // mantiene el push activo solo (si ya se dio permiso una vez)
}
function showLogin(){
  const w=document.querySelector('.window');if(w)w.style.display='none';
  let ov=document.getElementById('login-ov');
  if(!ov){ov=document.createElement('div');ov.id='login-ov';ov.className='login-ov';document.body.appendChild(ov);}
  ov.innerHTML='<form class="login-card" onsubmit="return doLogin(event)"><div class="login-brand"><span class="badge"><img src="/logo.jpg" alt="Riders Miami"></span><div><b>Riders Miami</b><div class="faint" style="font-size:12px">CRM del equipo</div></div></div><label>Usuario</label><input id="lg-user" autocomplete="username"><label>Clave</label><input id="lg-pass" type="password" autocomplete="current-password"><div id="lg-err" class="lg-err"></div><button class="btn" type="submit" style="width:100%;justify-content:center;padding:11px;margin-top:6px">Entrar</button></form>';
  ov.style.display='grid';
  setTimeout(()=>{const e=document.getElementById('lg-user');if(e)e.focus();},40);
}
async function doLogin(ev){
  ev.preventDefault();
  const usuario=(document.getElementById('lg-user').value||'').trim(),pass=document.getElementById('lg-pass').value||'';
  const err=document.getElementById('lg-err');err.textContent='';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario,pass})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){err.textContent=j.error||'No se pudo entrar';return false;}
    token=j.token;localStorage.setItem('crmToken',token);me=j.user;startApp();
  }catch(e){err.textContent='Error de conexión con el servidor';}
  return false;
}
function logout(){if(SERVER)api('/api/logout',{method:'POST'}).catch(()=>{});token='';localStorage.removeItem('crmToken');me=null;showLogin();}
async function boot(){
  if(!SERVER){me={rol:'admin',nombre:'Local'};applyRoleUI();loadData();return;}
  if(!token){showLogin();return;}
  try{const r=await api('/api/me');me=(await r.json()).user;startApp();}
  catch(e){showLogin();}
}
boot();
if('serviceWorker' in navigator&&location.protocol==='https:'){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
  // Cuando se instala una versión nueva, la app se actualiza sola (sin refrescar a mano).
  let _swReload=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(_swReload)return;_swReload=true;location.reload();});
}
